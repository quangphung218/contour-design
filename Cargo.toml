[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "local"

[workspace.dependencies]
od-contracts = { path = "crates/od-contracts" }
od-store = { path = "crates/od-store" }
od-content = { path = "crates/od-content" }
od-server = { path = "crates/od-server" }
od-export = { path = "crates/od-export" }
od-render-cdp = { path = "crates/od-render-cdp" }
od-mcp = { path = "crates/od-mcp" }

anyhow = "1"
arc-swap = "1"
axum = { version = "0.8", features = ["multipart", "macros"] }
base64 = "0.22"
chromiumoxide = { version = "0.9", default-features = false }
clap = { version = "4", features = ["derive", "env"] }
criterion = { version = "0.5", default-features = false }
flate2 = "1"
futures-util = "0.3"
hex = "0.4"
http-body-util = "0.1"
httpdate = "1"
lol_html = "3"
lopdf = { version = "0.46", default-features = false }
png = "0.18"
rayon = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking"] }
rmcp = { version = "3", features = ["server", "client", "transport-io", "transport-child-process"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "sync", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
dbg_macro = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
