[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "local"

[workspace.dependencies]
od-contracts = { path = "crates/od-contracts" }
od-store = { path = "crates/od-store" }
od-content = { path = "crates/od-content" }
od-server = { path = "crates/od-server" }
od-runtime = { path = "crates/od-runtime" }
od-runs = { path = "crates/od-runs" }
od-preview = { path = "crates/od-preview" }

anyhow = "1"
arc-swap = "1"
axum = { version = "0.8", features = ["multipart", "macros"] }
base64 = "0.22"
chromiumoxide = { version = "0.9", default-features = false }
clap = { version = "4", features = ["derive", "env"] }
criterion = { version = "0.5", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
httpdate = "1"
nix = { version = "0.30", default-features = false, features = ["signal", "process"] }
lol_html = "3"
notify = "8"
notify-debouncer-full = "0.7"
rayon = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio-util = { version = "0.7", features = ["io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "sync", "io-util", "process", "time"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
dbg_macro = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
