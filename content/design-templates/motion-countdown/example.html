<style>
/* Countdown: a 10 s, 1920x1080 HyperFrames composition.
   Every movement is a CSS animation that spans the whole film (--film) and
   loops; keyframe percentages are fractions of the 10 s film
   (1 s = 10.000%). The master timeline below pins every
   animation to the renderer's time. Sizes are in cqw (1cqw = 19.2px
   on the 1920px grid), so the stage scales to any preview. System fonts
   and inline SVG only: nothing is downloaded. */
@property --n { syntax: '<integer>'; inherits: false; initial-value: 0; }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
body { display: grid; place-items: center; }
#stage {
  --film: 10s;
  position: relative; overflow: hidden; container-type: size;
  width: min(100vw, calc(100vh * 1920 / 1080)); aspect-ratio: 1920 / 1080;
  background: #1a1033; color: #fdf8ff; font-family: ui-sans-serif, -apple-system, "Helvetica Neue", "Segoe UI", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
#stage * { box-sizing: border-box; }

.center { position: absolute; inset: 0; display: grid; place-items: center; }
.ring { position: absolute; width: 33.3333cqw; height: 33.3333cqw; }
.ring circle { fill: none; stroke-width: 14; }
.ring .track { stroke: rgba(253,248,255,.12); }
.ring .prog { stroke: #ff5fa2; stroke-linecap: round; stroke-dasharray: 100; transform: rotate(-90deg); transform-origin: 50% 50%; transform-box: fill-box; }
.digit { position: absolute; font-size: 19.7917cqw; font-weight: 900; letter-spacing: -0.5208cqw; line-height: 1; font-variant-numeric: tabular-nums; }
.live { position: absolute; font-size: 8.8542cqw; font-weight: 900; letter-spacing: -0.2083cqw; }
.live em { font-style: normal; color: #ff5fa2; }
.burst { position: absolute; width: 46.875cqw; height: 46.875cqw; }
.burst line { stroke: #ffd23f; stroke-width: 10; stroke-linecap: round; stroke-dasharray: 100; }
.sub { position: absolute; bottom: 6.25cqw; left: 0; right: 0; text-align: center; font: 600 1.5625cqw/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 0.4167cqw; color: #b9a8d9; }

<body>
<div id="stage" data-composition-id="main" data-start="0" data-duration="10"
  data-width="1920" data-height="1080" data-fps="30" data-poster-time="1.5">
<div class="center">
  <svg class="ring" id="ring" viewBox="0 0 200 200"><circle class="track" cx="100" cy="100" r="90"/><circle class="prog" id="prog" cx="100" cy="100" r="90" pathLength="100"/></svg>
  <div class="digit" id="d5">5</div><div class="digit" id="d4">4</div><div class="digit" id="d3">3</div><div class="digit" id="d2">2</div><div class="digit" id="d1">1</div>
  <svg class="burst" viewBox="0 0 200 200" aria-hidden="true">
    <line id="r1" x1="100" y1="40" x2="100" y2="6" pathLength="100"/><line id="r2" x1="142" y1="58" x2="166" y2="34" pathLength="100"/>
    <line id="r3" x1="160" y1="100" x2="194" y2="100" pathLength="100"/><line id="r4" x1="142" y1="142" x2="166" y2="166" pathLength="100"/>

</div>
<script>
// Master timeline. The renderer pauses it and calls seek(t) for every frame;
// seek pins each CSS animation of the film to t, so the film is the same on
// every render. Without scripts (the gallery preview) the CSS loops alone.
(() => {
  const DURATION = 10;
  const all = () => (document.getAnimations ? document.getAnimations() : []);
  const timeline = {
    duration: () => DURATION,
    pause() { all().forEach((a) => a.pause()); return timeline; },
    play() { all().forEach((a) => a.play()); return timeline; },
    seek(t) {
      const ms = Math.min(Math.max(Number(t) || 0, 0), DURATION) * 1000;
      all().forEach((a) => { a.pause(); a.currentTime = ms; });
      return timeline;
    },
  };
  window.__timelines = window.__timelines || {};
  window.__timelines.main = timeline;
})();
</script>
