<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Customer testimonial</title>
<meta name="od-motion-output" content="video">

<style>
/* Customer testimonial: a 9 s, 1080x1080 HyperFrames composition.
   Every movement is a CSS animation that spans the whole film (--film) and
   loops; keyframe percentages are fractions of the 9 s film
   (1 s = 11.1111%). The master timeline below pins every
   animation to the renderer's time. Sizes are in cqw (1cqw = 10.8px
   on the 1080px grid), so the stage scales to any preview. System fonts
   and inline SVG only: nothing is downloaded. */
html, body { margin: 0; height: 100%; background: #fff7ef; overflow: hidden; }
body { display: grid; place-items: center; }
#stage {
  --film: 9s;
  position: relative; overflow: hidden; container-type: size;
  width: min(100vw, calc(100vh * 1080 / 1080)); aspect-ratio: 1080 / 1080;
  background: #fff7ef; color: #2a1b12; font-family: ui-sans-serif, -apple-system, "Helvetica Neue", "Segoe UI", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
#stage * { box-sizing: border-box; }

.card { position: absolute; left: 6.4815cqw; top: 6.4815cqw; width: 87.037cqw; height: 87.037cqw; border-radius: 4.4444cqw; background: #ffffff; box-shadow: 0 2.7778cqw 6.4815cqw rgba(42,27,18,.12); padding: 8.3333cqw 7.4074cqw; }
.stars { display: flex; gap: 1.2963cqw; }
.stars svg { width: 5.7407cqw; height: 5.7407cqw; }
.stars path { fill: #f5b301; }
.rating { margin-top: 1.8519cqw; font: 600 2.2222cqw/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 0.2778cqw; color: #8a7465; }
.quote { margin-top: 5.5556cqw; font-size: 5.7407cqw; font-weight: 700; letter-spacing: -0.1389cqw; line-height: 1.16; }
.quote span { display: block; }
.hl { position: relative; display: inline-block; }
.hl svg { position: absolute; left: -0.5556cqw; right: -0.5556cqw; bottom: -1.2963cqw; width: calc(100% + 1.1111cqw); height: 2.5926cqw; }
.hl path { fill: none; stroke: #e8743b; stroke-width: 7; stroke-linecap: round; stroke-dasharray: 100; }
.who { position: absolute; left: 7.4074cqw; bottom: 8.3333cqw; display: flex; align-items: center; gap: 2.7778cqw; }
.avatar { width: 11.1111cqw; height: 11.1111cqw; border-radius: 50%; background: #e8743b; color: #fff7ef; display: grid; place-items: center; font-size: 4.0741cqw; font-weight: 800; }
.name { font-size: 3.5185cqw; font-weight: 800; }
.role { font-size: 2.5926cqw; color: #8a7465; margin-top: 0.5556cqw; }
.mark { position: absolute; right: 6.4815cqw; top: 5.5556cqw; font-size: 27.7778cqw; font-weight: 900; line-height: 1; color: #fbe3d3; }

@keyframes k1 {
  0% { opacity: 0; transform: translateY(5.5556cqw) scale(.96); animation-timing-function: linear; }
  1.1111% { opacity: 0; transform: translateY(5.5556cqw) scale(.96); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  8.8889% { opacity: 1; transform: none; animation-timing-function: linear; }
  92.2222% { opacity: 1; transform: none; animation-timing-function: cubic-bezier(.55,0,1,.45); }
  97.7778% { opacity: 0; transform: translateY(5.5556cqw) scale(.96); animation-timing-function: linear; }
  100% { opacity: 0; transform: translateY(5.5556cqw) scale(.96); animation-timing-function: linear; }
}
@keyframes k2 {
  0% { opacity: 0; transform: translateY(-3.7037cqw); animation-timing-function: linear; }
  4.4444% { opacity: 0; transform: translateY(-3.7037cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  13.3333% { opacity: 1; transform: none; animation-timing-function: linear; }
  100% { opacity: 1; transform: none; animation-timing-function: linear; }
}
@keyframes k3 {
  0% { opacity: 0; transform: scale(.4); animation-timing-function: linear; }
  8.2222% { opacity: 0; transform: scale(.4); animation-timing-function: cubic-bezier(.34,1.56,.64,1); }
  12.6667% { opacity: 1; transform: none; animation-timing-function: linear; }
  100% { opacity: 1; transform: none; animation-timing-function: linear; }
}
@keyframes k4 {

}

  11.3333% { opacity: 0; transform: scale(.4); animation-timing-function: cubic-bezier(.34,1.56,.64,1); }
  15.7778% { opacity: 1; transform: none; animation-timing-function: linear; }
  100% { opacity: 1; transform: none; animation-timing-function: linear; }

@keyframes k6 {
  0% { opacity: 0; transform: scale(.4); animation-timing-function: linear; }
  12.8889% { opacity: 0; transform: scale(.4); animation-timing-function: cubic-bezier(.34,1.56,.64,1); }
  17.3333% { opacity: 1; transform: none; animation-timing-function: linear; }

}
@keyframes k7 {
  0% { opacity: 0; transform: scale(.4); animation-timing-function: linear; }
  14.4444% { opacity: 0; transform: scale(.4); animation-timing-function: cubic-bezier(.34,1.56,.64,1); }
  18.8889% { opacity: 1; transform: none; animation-timing-function: linear; }
  100% { opacity: 1; transform: none; animation-timing-function: linear; }

@keyframes k8 {
  0% { opacity: 0; transform: translateX(-1.8519cqw); animation-timing-function: linear; }
  16.6667% { opacity: 0; transform: translateX(-1.8519cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  22.2222% { opacity: 1; transform: none; animation-timing-function: linear; }

@keyframes k9 {

  21.1111% { opacity: 0; transform: translateY(2.7778cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  27.7778% { opacity: 1; transform: none; animation-timing-function: linear; }
  100% { opacity: 1; transform: none; animation-timing-function: linear; }
}
@keyframes k10 {
  0% { opacity: 0; transform: translateY(2.7778cqw); animation-timing-function: linear; }
  25% { opacity: 0; transform: translateY(2.7778cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  31.6667% { opacity: 1; transform: none; animation-timing-function: linear; }
  100% { opacity: 1; transform: none; animation-timing-function: linear; }
}
@keyframes k11 {
  0% { opacity: 0; transform: translateY(2.7778cqw); animation-timing-function: linear; }
  28.8889% { opacity: 0; transform: translateY(2.7778cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  35.5556% { opacity: 1; transform: none; animation-timing-function: linear; }

@keyframes k12 {

  37.7778% { stroke-dashoffset: 100; opacity: 1; animation-timing-function: cubic-bezier(.4,0,.2,1); }
  45.5556% { stroke-dashoffset: 0; opacity: 1; animation-timing-function: linear; }
  100% { stroke-dashoffset: 0; opacity: 1; animation-timing-function: linear; }
}
@keyframes k13 {
  0% { opacity: 0; transform: scale(.4); animation-timing-function: linear; }
  44.4444% { opacity: 0; transform: scale(.4); animation-timing-function: cubic-bezier(.34,1.56,.64,1); }
  50% { opacity: 1; transform: none; animation-timing-function: linear; }
  100% { opacity: 1; transform: none; animation-timing-function: linear; }
}
@keyframes k14 {
  0% { opacity: 0; transform: translateX(-2.7778cqw); animation-timing-function: linear; }
  47.7778% { opacity: 0; transform: translateX(-2.7778cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  54.4444% { opacity: 1; transform: none; animation-timing-function: linear; }
  100% { opacity: 1; transform: none; animation-timing-function: linear; }
}
#card { animation: k1 var(--film) linear infinite both; }
#mark { animation: k2 var(--film) linear infinite both; }
#st1 { animation: k3 var(--film) linear infinite both; }
#st2 { animation: k4 var(--film) linear infinite both; }
#st3 { animation: k5 var(--film) linear infinite both; }
#st4 { animation: k6 var(--film) linear infinite both; }
#st5 { animation: k7 var(--film) linear infinite both; }
#rating { animation: k8 var(--film) linear infinite both; }
#q1 { animation: k9 var(--film) linear infinite both; }

<body>
<div id="stage" data-composition-id="main" data-start="0" data-duration="9"
  data-width="1080" data-height="1080" data-fps="30" data-poster-time="5.5">
<div class="card" id="card">
  <div class="mark" id="mark">”</div>
  <div class="stars"><svg viewBox="0 0 24 24" id="st1" aria-hidden="true"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 21l1.6-7L2 9.2l7.1-.6z"/></svg><svg viewBox="0 0 24 24" id="st2" aria-hidden="true"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 21l1.6-7L2 9.2l7.1-.6z"/></svg><svg viewBox="0 0 24 24" id="st3" aria-hidden="true"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 21l1.6-7L2 9.2l7.1-.6z"/></svg><svg viewBox="0 0 24 24" id="st4" aria-hidden="true"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 21l1.6-7L2 9.2l7.1-.6z"/></svg><svg viewBox="0 0 24 24" id="st5" aria-hidden="true"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 21l1.6-7L2 9.2l7.1-.6z"/></svg></div>

    <span id="q3"><span class="hl">a full day a week.<svg viewBox="0 0 300 28" preserveAspectRatio="none" aria-hidden="true"><path id="hl" d="M4 18 C80 8 200 6 296 14" pathLength="100"/></svg></span></span>
  </div>

  </div>
</div>
</div>
<script>
// Master timeline. The renderer pauses it and calls seek(t) for every frame;
// seek pins each CSS animation of the film to t, so the film is the same on
// every render. Without scripts (the gallery preview) the CSS loops alone.
(() => {
  const DURATION = 9;
  const all = () => (document.getAnimations ? document.getAnimations() : []);
  const timeline = {
    duration: () => DURATION,
    pause() { all().forEach((a) => a.pause()); return timeline; },
    play() { all().forEach((a) => a.play()); return timeline; },
    seek(t) {
      const ms = Math.min(Math.max(Number(t) || 0, 0), DURATION) * 1000;
      all().forEach((a) => { a.pause(); a.currentTime = ms; });
      return timeline;
    },
  };
  window.__timelines = window.__timelines || {};
  window.__timelines.main = timeline;
})();
</script>
</body>
