<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chapter title cards</title>
<meta name="od-motion-output" content="video">
<meta name="od-motion-audio" content="silent">
<style>
/* Chapter title cards: a 9 s, 1920x1080 HyperFrames composition.
   Every movement is a CSS animation that spans the whole film (--film) and
   loops; keyframe percentages are fractions of the 9 s film
   (1 s = 11.111%). The master timeline below pins every
   animation to the renderer's time. Sizes are in cqw (1cqw = 19.2px
   on the 1920px grid), so the stage scales to any preview. System fonts
   and inline SVG only: nothing is downloaded. */
@property --n { syntax: '<integer>'; inherits: false; initial-value: 0; }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
body { display: grid; place-items: center; }
#stage {
  --film: 9s;
  position: relative; overflow: hidden; container-type: size;
  width: min(100vw, calc(100vh * 1920 / 1080)); aspect-ratio: 1920 / 1080;
  background: #eee8dc; color: #22201c; font-family: ui-serif, "Iowan Old Style", Charter, Georgia, "Times New Roman", serif;
  -webkit-font-smoothing: antialiased;
}
#stage * { box-sizing: border-box; }

.ch { position: absolute; inset: 0; display: grid; grid-template-columns: 18.75cqw 1fr; grid-template-rows: auto auto; align-content: center; column-gap: 3.125cqw; row-gap: 1.5625cqw; padding: 0 9.375cqw; background: #eee8dc; }
.no { grid-row: 1 / 3; font-family: ui-sans-serif, -apple-system, "Helvetica Neue", "Segoe UI", Arial, sans-serif; font-size: 15.625cqw; font-weight: 900; letter-spacing: -0.7292cqw; color: #b5532f; line-height: .8; overflow: hidden; align-self: center; }
.no span { display: block; }
.rule { grid-column: 2; height: 0.2083cqw; background: #22201c; transform-origin: left; align-self: end; }
.tt { grid-column: 2; display: flex; flex-direction: column; gap: 0.9375cqw; overflow: hidden; }
.t { font-size: 6.25cqw; font-weight: 700; letter-spacing: -0.1562cqw; line-height: 1; }
.s { font-family: ui-sans-serif, -apple-system, "Helvetica Neue", "Segoe UI", Arial, sans-serif; font-size: 1.9792cqw; color: #6d655a; }
#c2 { z-index: 2; } #c3 { z-index: 3; }
.paper { position: absolute; inset: 0; z-index: 9; pointer-events: none;
  background: repeating-radial-gradient(circle at 30% 20%, rgba(34,32,28,.025) 0 0.1042cqw, rgba(34,32,28,0) 0.1042cqw 0.3125cqw); }

@keyframes k1 {
  0% { transform: translateY(15.625cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  2.778% { transform: translateY(15.625cqw); animation-timing-function: cubic-bezier(.16,1,.3,1); }
  11.667% { transform: none; animation-timing-function: linear; }
  100% { transform: none; animation-timing-function: linear; }
}
@keyframes k2 {
  0% { transform: scaleX(0); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  5.556% { transform: scaleX(0); animation-timing-function: cubic-bezier(.65,0,.35,1); }
  14.444% { transform: none; animation-timing-function: linear; }
  100% { transform: none; animation-timing-function: linear; }
}
@keyframes k3 {
  0% { transform: translateY(6.7708cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  7.778% { transform: translateY(6.7708cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  15.556% { transform: none; animation-timing-function: linear; }
  100% { transform: none; animation-timing-function: linear; }
}
@keyframes k4 {
  0% { opacity: 0; transform: translateY(1.0417cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  11.111% { opacity: 0; transform: translateY(1.0417cqw); animation-timing-function: cubic-bezier(.4,0,.2,1); }
  17.778% { opacity: 1; transform: none; animation-timing-function: linear; }
  100% { opacity: 1; transform: none; animation-timing-function: linear; }
}
@keyframes k5 {
  0% { transform: translateX(100cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  32.222% { transform: translateX(100cqw); animation-timing-function: cubic-bezier(.65,0,.35,1); }
  38.889% { transform: translateX(0cqw); animation-timing-function: linear; }
  100% { transform: translateX(0cqw); animation-timing-function: linear; }
}
@keyframes k6 {
  0% { transform: translateY(15.625cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  36.111% { transform: translateY(15.625cqw); animation-timing-function: cubic-bezier(.16,1,.3,1); }
  45% { transform: none; animation-timing-function: linear; }
  100% { transform: none; animation-timing-function: linear; }
}
@keyframes k7 {
  0% { transform: scaleX(0); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  38.889% { transform: scaleX(0); animation-timing-function: cubic-bezier(.65,0,.35,1); }
  47.778% { transform: none; animation-timing-function: linear; }
  100% { transform: none; animation-timing-function: linear; }
}
@keyframes k8 {
  0% { transform: translateY(6.7708cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  41.111% { transform: translateY(6.7708cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  48.889% { transform: none; animation-timing-function: linear; }
  100% { transform: none; animation-timing-function: linear; }
}
@keyframes k9 {
  0% { opacity: 0; transform: translateY(1.0417cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  44.444% { opacity: 0; transform: translateY(1.0417cqw); animation-timing-function: cubic-bezier(.4,0,.2,1); }
  51.111% { opacity: 1; transform: none; animation-timing-function: linear; }
  100% { opacity: 1; transform: none; animation-timing-function: linear; }
}
@keyframes k10 {
  0% { transform: translateX(100cqw); opacity: 1; animation-timing-function: cubic-bezier(.22,1,.36,1); }
  65.556% { transform: translateX(100cqw); opacity: 1; animation-timing-function: cubic-bezier(.65,0,.35,1); }
  72.222% { transform: translateX(0cqw); opacity: 1; animation-timing-function: cubic-bezier(.22,1,.36,1); }
  93.333% { transform: translateX(0cqw); opacity: 1; animation-timing-function: cubic-bezier(.55,0,1,.45); }
  98.889% { transform: translateX(0cqw); opacity: 0; animation-timing-function: linear; }
  100% { transform: translateX(0cqw); opacity: 0; animation-timing-function: linear; }
}
@keyframes k11 {
  0% { transform: translateY(15.625cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  69.444% { transform: translateY(15.625cqw); animation-timing-function: cubic-bezier(.16,1,.3,1); }
  78.333% { transform: none; animation-timing-function: linear; }
  100% { transform: none; animation-timing-function: linear; }
}
@keyframes k12 {
  0% { transform: scaleX(0); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  72.222% { transform: scaleX(0); animation-timing-function: cubic-bezier(.65,0,.35,1); }
  81.111% { transform: none; animation-timing-function: linear; }
  100% { transform: none; animation-timing-function: linear; }
}
@keyframes k13 {
  0% { transform: translateY(6.7708cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  74.444% { transform: translateY(6.7708cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  82.222% { transform: none; animation-timing-function: linear; }
  100% { transform: none; animation-timing-function: linear; }
}
@keyframes k14 {
  0% { opacity: 0; transform: translateY(1.0417cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  77.778% { opacity: 0; transform: translateY(1.0417cqw); animation-timing-function: cubic-bezier(.4,0,.2,1); }
  84.444% { opacity: 1; transform: none; animation-timing-function: linear; }
  100% { opacity: 1; transform: none; animation-timing-function: linear; }
}
#no1 { animation: k1 var(--film) linear infinite both; }
#r1 { animation: k2 var(--film) linear infinite both; }
#t1 { animation: k3 var(--film) linear infinite both; }
#s1 { animation: k4 var(--film) linear infinite both; }
#c2 { animation: k5 var(--film) linear infinite both; }
#no2 { animation: k6 var(--film) linear infinite both; }
#r2 { animation: k7 var(--film) linear infinite both; }
#t2 { animation: k8 var(--film) linear infinite both; }
#s2 { animation: k9 var(--film) linear infinite both; }
#c3 { animation: k10 var(--film) linear infinite both; }
#no3 { animation: k11 var(--film) linear infinite both; }
#r3 { animation: k12 var(--film) linear infinite both; }
#t3 { animation: k13 var(--film) linear infinite both; }
#s3 { animation: k14 var(--film) linear infinite both; }
</style>
</head>
<body>
<div id="stage" data-composition-id="main" data-start="0" data-duration="9"
  data-width="1920" data-height="1080" data-fps="30" data-poster-time="1.8">
<div class="ch" id="c1"><div class="no"><span id="no1">01</span></div><div class="rule" id="r1"></div>
  <div class="tt"><div class="t" id="t1">The problem</div><div class="s" id="s1">Why the old way stalls</div></div></div>
<div class="ch" id="c2"><div class="no"><span id="no2">02</span></div><div class="rule" id="r2"></div>
  <div class="tt"><div class="t" id="t2">The idea</div><div class="s" id="s2">One small change</div></div></div>
<div class="ch" id="c3"><div class="no"><span id="no3">03</span></div><div class="rule" id="r3"></div>
  <div class="tt"><div class="t" id="t3">The result</div><div class="s" id="s3">What shipped, and what we learned</div></div></div>
<div class="paper"></div>
</div>
<script>
// Master timeline. The renderer pauses it and calls seek(t) for every frame;
// seek pins each CSS animation of the film to t, so the film is the same on
// every render. Without scripts (the gallery preview) the CSS loops alone.
(() => {
  const DURATION = 9;
  const all = () => (document.getAnimations ? document.getAnimations() : []);
  const timeline = {
    duration: () => DURATION,
    pause() { all().forEach((a) => a.pause()); return timeline; },
    play() { all().forEach((a) => a.play()); return timeline; },
    seek(t) {
      const ms = Math.min(Math.max(Number(t) || 0, 0), DURATION) * 1000;
      all().forEach((a) => { a.pause(); a.currentTime = ms; });
      return timeline;
    },
  };
  window.__timelines = window.__timelines || {};
  window.__timelines.main = timeline;
})();
</script>
</body>
</html>
