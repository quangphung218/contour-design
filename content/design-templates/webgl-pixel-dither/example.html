<title>Dusk FM · Dithered pixel sunset</title>
<style>
:root{--bg:#2b1b3d;--fg:#ffb35c;--accent:#ffb35c;--font:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);overflow:hidden}
body{font-family:var(--font, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif)}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .8s ease}
html.gl-on #gl{opacity:1}
.fallback{position:fixed;inset:0;overflow:hidden}
html.gl-on .fallback{visibility:hidden;transition:visibility 0s .8s}
.fallback svg{position:absolute;inset:0;width:100%;height:100%}
.gl-note{display:none;position:fixed;right:20px;bottom:18px;z-index:3;font:12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;padding:6px 10px;border-radius:6px;background:rgba(0,0,0,.45);color:#fff}
html.gl-off .gl-note{display:block}
.overlay{position:fixed;z-index:2;pointer-events:none}
.overlay a,.overlay button{pointer-events:auto}
@media (prefers-reduced-motion: reduce){#gl{transition:none}}
/* Narrow frames (phones, the studio preview after Remix): the text blocks
   leave their corners and stack in the page over the visual, each on a
   panel of the page colour, so nothing overlaps or runs off the edge. */
@media (max-width:860px){
  html,body{height:auto;min-height:100%;overflow-x:hidden;overflow-y:auto}
  body{padding:16px 0 24px}
  .overlay{position:relative!important;inset:auto!important;transform:none!important;width:auto!important;max-width:none!important;margin:0 16px 12px;padding:16px;border-radius:12px;background:color-mix(in srgb,var(--bg) 84%,transparent);overflow-wrap:anywhere}
}
.overlay.brand{left:5vw;top:6vh}
.call{font-family:Impact,'Arial Narrow Bold','Arial Narrow',sans-serif;font-size:clamp(3rem,9vw,8rem);line-height:.85;letter-spacing:.02em;color:#ffb35c;text-shadow:6px 6px 0 #2b1b3d}
.freq{margin-top:.6rem;font-size:1rem;letter-spacing:.2em;color:#ffb35c;background:#2b1b3d;display:inline-block;padding:.2rem .5rem}
.overlay.player{left:5vw;bottom:6vh;width:min(30rem,90vw);padding:1rem 1.2rem;background:#2b1b3d;border:3px solid #ffb35c;color:#ffb35c;font-size:.9rem;line-height:1.5}
.player .now{display:flex;justify-content:space-between;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase}
.player b{display:block;margin:.5rem 0 .2rem;font-size:1.15rem}
.bar{margin-top:.8rem;height:10px;background:repeating-linear-gradient(90deg,#ffb35c 0 6px,transparent 6px 9px);width:62%}
.overlay.listen{right:5vw;bottom:6vh}
.listen a{display:inline-block;padding:.9rem 1.4rem;background:#ffb35c;color:#2b1b3d;text-decoration:none;font-weight:700;letter-spacing:.14em;text-transform:uppercase;box-shadow:6px 6px 0 #2b1b3d}
</style>
