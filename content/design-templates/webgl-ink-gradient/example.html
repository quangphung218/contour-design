<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mireille Colour Lab · Autumn palette</title>
<style>
:root{--bg:#fcf2e0;--fg:#2a1a24;--accent:#8c4273;--font:'Avenir Next',Avenir,'Helvetica Neue',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);overflow:hidden}
body{font-family:var(--font, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif)}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .8s ease}
html.gl-on #gl{opacity:1}
.fallback{position:fixed;inset:0;overflow:hidden}
html.gl-on .fallback{visibility:hidden;transition:visibility 0s .8s}
.fallback svg{position:absolute;inset:0;width:100%;height:100%}
.gl-note{display:none;position:fixed;right:20px;bottom:18px;z-index:3;font:12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;padding:6px 10px;border-radius:6px;background:rgba(0,0,0,.45);color:#fff}
html.gl-off .gl-note{display:block}
.overlay{position:fixed;z-index:2;pointer-events:none}
.overlay a,.overlay button{pointer-events:auto}
@media (prefers-reduced-motion: reduce){#gl{transition:none}}
.fallback{background:
  radial-gradient(60% 70% at 78% 30%, rgba(140,66,115,.85), transparent 70%),
  radial-gradient(50% 60% at 90% 85%, rgba(33,120,127,.9), transparent 70%),
  radial-gradient(55% 65% at 55% 70%, rgba(249,203,173,.95), transparent 70%),
  linear-gradient(90deg, #fcf2e0 0%, #fcf2e0 30%, #f9cbad 100%)}
.fallback::after{content:"";position:absolute;inset:0;opacity:.18;background-image:repeating-radial-gradient(circle at 13% 27%, rgba(0,0,0,.25) 0 1px, transparent 1px 3px)}
.overlay.hero{left:7vw;top:50%;transform:translateY(-50%);max-width:34rem}
.kicker{font-size:.8rem;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:1.4rem}
h1{font-family:'Iowan Old Style',Palatino,'Palatino Linotype',Georgia,serif;font-weight:400;font-size:clamp(2.6rem,6vw,5.4rem);line-height:1.02;letter-spacing:-.02em}
.sub{margin-top:1.4rem;font-size:1.1rem;line-height:1.55;max-width:26rem;color:#4b3443}
.cta{display:inline-block;margin-top:2rem;padding:.85rem 1.5rem;border-radius:999px;background:#2a1a24;color:#fcf2e0;text-decoration:none;font-size:.95rem}
.overlay.foot{left:7vw;bottom:5vh;font-size:.8rem;color:#4b3443;letter-spacing:.08em}
.overlay.swatches{right:4vw;bottom:5vh;display:flex;gap:.5rem}
.swatches span{width:2.2rem;height:2.2rem;border-radius:50%;border:2px solid rgba(255,255,255,.7)}
</style>
</head>
<body>
<div class="fallback" aria-hidden="true" data-webgl-fallback>

</div>
<canvas id="gl" aria-hidden="true"></canvas>
<div class="overlay hero">
  <p class="kicker">Mireille Colour Lab · Autumn palette</p>
  <h1>Colour that moves with the light.</h1>
  <p class="sub">Four new pigments mixed for rooms that change all day: Apricot Hour, Plum Velvet, Harbour and Linen.</p>
  <a class="cta" href="#palette">See the palette</a>
</div>
<div class="overlay foot">Mixed and tinted by hand in Lyon · Batch 07</div>
<div class="overlay swatches" aria-label="Palette"><span style="background:#fcf2e0"></span><span style="background:#f9cbad"></span><span style="background:#8c4273"></span><span style="background:#21787f"></span></div>
<p class="gl-note" role="status">Static poster: this browser has no WebGL.</p>
<script>
var GLX = (function () {
  var root = document.documentElement;
  function fail(why) {
    root.classList.remove('gl-on');
    root.classList.add('gl-off');
    if (why) console.warn('[webgl] ' + why);
    return null;
  }
  function compile(gl, type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.error(gl.getShaderInfoLog(s));
      return null;
    }
    return s;
  }
  function program(gl, vs, fs) {
    var v = compile(gl, gl.VERTEX_SHADER, vs), f = compile(gl, gl.FRAGMENT_SHADER, fs);
    if (!v || !f) return null;
    var p = gl.createProgram();
    gl.attachShader(p, v); gl.attachShader(p, f); gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(p)); return null; }
    return p;
  }
  function start(setup) {
    var canvas = document.getElementById('gl');
    var gl = null;
    try {
      var opts = { alpha: false, antialias: true, premultipliedAlpha: false };
      gl = canvas.getContext('webgl2', opts) || canvas.getContext('webgl', opts);
    } catch (_) {}
    if (!gl) return fail('no WebGL context; showing the static poster');
    var still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    var pointer = [0.5, 0.5], targetPointer = [0.5, 0.5];
    window.addEventListener('pointermove', function (e) {
      targetPointer = [e.clientX / innerWidth, 1 - e.clientY / innerHeight];
    }, { passive: true });
    var draw = setup(gl, { program: function (vs, fs) { return program(gl, vs, fs); } });
    if (!draw) return fail('shader setup failed; showing the static poster');
    function resize() {
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var w = Math.max(1, Math.round(canvas.clientWidth * dpr));
      var h = Math.max(1, Math.round(canvas.clientHeight * dpr));
      if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
      gl.viewport(0, 0, w, h);
    }
    var t0 = performance.now(), raf = 0, shown = false, lost = false;
    function frame(now) {
      raf = 0;
      if (lost) return;
      resize();
      pointer[0] += (targetPointer[0] - pointer[0]) * 0.06;
      pointer[1] += (targetPointer[1] - pointer[1]) * 0.06;
      var t = still ? 6.0 : (now - t0) / 1000;
      draw(t, [canvas.width, canvas.height], pointer);
      if (!shown) {
        shown = true;
        var err = gl.getError();
        if (err !== gl.NO_ERROR) console.warn('[webgl] getError after first frame: ' + err);
        root.classList.add('gl-on');
      }
      if (!still && !document.hidden) raf = requestAnimationFrame(frame);
    }
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && !raf && !still) raf = requestAnimationFrame(frame);
    });
    window.addEventListener('resize', function () { if (still && !raf) raf = requestAnimationFrame(frame); });
    canvas.addEventListener('webglcontextlost', function (e) { e.preventDefault(); lost = true; fail('context lost'); });
    raf = requestAnimationFrame(frame);
    return gl;
  }
  // Full-screen triangle + one fragment shader with uRes, uTime, uPointer.
  var FS_VERT = 'attribute vec2 aPos; void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }';
  function fragment(src, extra) {
    return start(function (gl, h) {
      var p = h.program(FS_VERT, src);
      if (!p) return null;
      var buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
      var loc = gl.getAttribLocation(p, 'aPos');
      var uRes = gl.getUniformLocation(p, 'uRes');
      var uTime = gl.getUniformLocation(p, 'uTime');
      var uPointer = gl.getUniformLocation(p, 'uPointer');
      return function (t, res, ptr) {
        gl.useProgram(p);
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
        gl.uniform2f(uRes, res[0], res[1]);
        gl.uniform1f(uTime, t);
        if (uPointer) gl.uniform2f(uPointer, ptr[0], ptr[1]);
        if (extra) extra(gl, p, t);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
      };
    });
  }
  // Column-major perspective and look-at for the 3D point scenes.
  function perspective(fovy, aspect, near, far) {
    var f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);
    return [f / aspect, 0, 0, 0, 0, f, 0, 0, 0, 0, (far + near) * nf, -1, 0, 0, 2 * far * near * nf, 0];
  }
  function mul(a, b) {
    var o = new Array(16);
    for (var c = 0; c < 4; c++) for (var r = 0; r < 4; r++) {
      var s = 0;
      for (var k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k];
      o[c * 4 + r] = s;
    }
    return o;
  }
  function lookAt(eye, at, up) {
    function sub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
    function norm(a) { var l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; }
    function cross(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
    function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
    var z = norm(sub(eye, at)), x = norm(cross(up, z)), y = cross(z, x);
    return [x[0], y[0], z[0], 0, x[1], y[1], z[1], 0, x[2], y[2], z[2], 0, -dot(x, eye), -dot(y, eye), -dot(z, eye), 1];
  }
  return { start: start, fragment: fragment, perspective: perspective, mul: mul, lookAt: lookAt };
})();
GLX.fragment([
  'precision highp float;',
  'uniform vec2 uRes;',
  'uniform float uTime;',
  'uniform vec2 uPointer;',
  '',
  'float hash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }',
  'float noise(vec2 p){',
  '  vec2 i = floor(p), f = fract(p);',
  '  vec2 u = f * f * (3.0 - 2.0 * f);',
  '  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);',
  '}',
  'float fbm(vec2 p){',
  '  float v = 0.0, a = 0.5;',
  '  mat2 m = mat2(1.6, 1.2, -1.2, 1.6);',
  '  for (int i = 0; i < 5; i++) { v += a * noise(p); p = m * p; a *= 0.5; }',
  '  return v;',
  '}',
  '',
  'void main(){',
  '  vec2 p = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;',
  '  float t = uTime * 0.06;',
  '  vec2 q = vec2(fbm(p * 1.4 + t), fbm(p * 1.4 - t + 3.1));',
  '  vec2 r = vec2(fbm(p * 1.2 + 2.0 * q + vec2(1.7, 9.2) + t * 1.3), fbm(p * 1.2 + 2.0 * q + vec2(8.3, 2.8) - t));',
  '  r += (uPointer - 0.5) * 0.25;',
  '  float f = fbm(p + r);',
  '  vec3 c1 = vec3(0.98, 0.80, 0.68), c2 = vec3(0.55, 0.26, 0.45), c3 = vec3(0.13, 0.47, 0.50), c4 = vec3(0.99, 0.95, 0.88);',
  '  vec3 col = mix(c4, c1, smoothstep(0.25, 0.6, f));',
  '  col = mix(col, c2, smoothstep(0.55, 0.95, length(q) + 0.15 * p.x));',
  '  col = mix(col, c3, smoothstep(0.55, 1.0, r.x + 0.2 * p.x));',
  '  col = mix(col, c4, smoothstep(0.2, -0.6, p.x) * 0.55);',
  '  float g = hash(gl_FragCoord.xy + fract(uTime)) * 0.05 - 0.025;',
  '  gl_FragColor = vec4(col + g, 1.0);',
  '}'
].join('\n'));
</script>
</body>
</html>
