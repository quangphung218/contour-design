<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product feature callouts</title>
<meta name="od-motion-output" content="video">
<meta name="od-motion-audio" content="silent">
<style>
/* Product feature callouts: a 10 s, 1920x1080 HyperFrames composition.
   Every movement is a CSS animation that spans the whole film (--film) and
   loops; keyframe percentages are fractions of the 10 s film
   (1 s = 10.000%). The master timeline below pins every
   animation to the renderer's time. Sizes are in cqw (1cqw = 19.2px
   on the 1920px grid), so the stage scales to any preview. System fonts
   and inline SVG only: nothing is downloaded. */
@property --n { syntax: '<integer>'; inherits: false; initial-value: 0; }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
body { display: grid; place-items: center; }
#stage {
  --film: 10s;
  position: relative; overflow: hidden; container-type: size;
  width: min(100vw, calc(100vh * 1920 / 1080)); aspect-ratio: 1920 / 1080;
  background: #e5ece4; color: #1e2a24; font-family: ui-sans-serif, -apple-system, "Helvetica Neue", "Segoe UI", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
#stage * { box-sizing: border-box; }

.num { counter-reset: n var(--n); font-variant-numeric: tabular-nums; }
.num::before { content: counter(n); }

.phone { position: absolute; left: 50%; top: 50%; width: 21.875cqw; height: 44.7917cqw; margin: -22.3958cqw 0 0 -10.9375cqw; border-radius: 3.3333cqw; background: #1e2a24; padding: 0.9375cqw; box-shadow: 0 2.0833cqw 4.1667cqw rgba(30,42,36,.25); }
.screen { width: 100%; height: 100%; border-radius: 2.5cqw; background: #fbfdfb; overflow: hidden; padding: 3.6458cqw 1.7708cqw; display: flex; flex-direction: column; gap: 1.25cqw; }
.bal { font-size: 1.3542cqw; color: #6a786f; font-weight: 600; }
.amt { font-size: 3.9583cqw; font-weight: 800; letter-spacing: -0.1042cqw; }
.row { height: 4.4792cqw; border-radius: 1.0417cqw; background: #eef3ee; display: flex; align-items: center; gap: 0.9375cqw; padding: 0 1.0417cqw; }
.row i { width: 2.3958cqw; height: 2.3958cqw; border-radius: 0.7292cqw; background: #3fa66b; flex: none; }
.row b { flex: 1; height: 0.7292cqw; border-radius: 0.3646cqw; background: #cfd9d1; }
.cap { height: 1.1458cqw; border-radius: 0.5729cqw; background: #eef3ee; overflow: hidden; }
.cap i { display: block; height: 100%; width: 68%; background: #f2a541; transform-origin: left; }
.lines { position: absolute; inset: 0; width: 100%; height: 100%; }
.lines path { fill: none; stroke: #1e2a24; stroke-width: 3; stroke-dasharray: 100; }
.lines circle { fill: #3fa66b; transform-box: fill-box; transform-origin: center; }
.lab { position: absolute; width: 21.875cqw; font-size: 2.0833cqw; font-weight: 800; line-height: 1.1; letter-spacing: -0.0521cqw; }
.lab small { display: block; font-size: 1.25cqw; font-weight: 500; color: #5c6b62; margin-top: 0.5208cqw; letter-spacing: 0; }

@keyframes k1 {
  0% { opacity: 0; transform: perspective(83.3333cqw) rotateY(-40deg) translateY(6.25cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  2% { opacity: 0; transform: perspective(83.3333cqw) rotateY(-40deg) translateY(6.25cqw); animation-timing-function: cubic-bezier(.16,1,.3,1); }
  14% { opacity: 1; transform: none; animation-timing-function: cubic-bezier(.22,1,.36,1); }
  93% { opacity: 1; transform: none; animation-timing-function: cubic-bezier(.55,0,1,.45); }
  99% { opacity: 0; transform: none; animation-timing-function: linear; }
  100% { opacity: 0; transform: none; animation-timing-function: linear; }
}
@keyframes k2 {
  0% { --n: 0; animation-timing-function: cubic-bezier(.22,1,.36,1); }
  10% { --n: 0; animation-timing-function: cubic-bezier(.22,1,.36,1); }
  26% { --n: 1284; animation-timing-function: linear; }
  100% { --n: 1284; animation-timing-function: linear; }
}
@keyframes k3 {
  0% { transform: scaleX(0); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  14% { transform: scaleX(0); animation-timing-function: cubic-bezier(.65,0,.35,1); }
  24% { transform: none; animation-timing-function: linear; }
  100% { transform: none; animation-timing-function: linear; }
}
@keyframes k4 {
  0% { opacity: 0; transform: translateX(-1.5625cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  14.5% { opacity: 0; transform: translateX(-1.5625cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  20.5% { opacity: 1; transform: none; animation-timing-function: linear; }
  100% { opacity: 1; transform: none; animation-timing-function: linear; }
}
@keyframes k5 {
  0% { opacity: 0; transform: translateX(-1.5625cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  16% { opacity: 0; transform: translateX(-1.5625cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  22% { opacity: 1; transform: none; animation-timing-function: linear; }
  100% { opacity: 1; transform: none; animation-timing-function: linear; }
}
@keyframes k6 {
  0% { opacity: 0; transform: translateX(-1.5625cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  17.5% { opacity: 0; transform: translateX(-1.5625cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  23.5% { opacity: 1; transform: none; animation-timing-function: linear; }
  100% { opacity: 1; transform: none; animation-timing-function: linear; }
}
@keyframes k7 {
  0% { opacity: 0; transform: scale(0); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  28% { opacity: 0; transform: scale(0); animation-timing-function: cubic-bezier(.34,1.56,.64,1); }
  31% { opacity: 1; transform: none; animation-timing-function: linear; }
  100% { opacity: 1; transform: none; animation-timing-function: linear; }
}
@keyframes k8 {
  0% { stroke-dashoffset: 100; animation-timing-function: cubic-bezier(.22,1,.36,1); }
  29% { stroke-dashoffset: 100; animation-timing-function: cubic-bezier(.65,0,.35,1); }
  36% { stroke-dashoffset: 0; animation-timing-function: linear; }
  100% { stroke-dashoffset: 0; animation-timing-function: linear; }
}
@keyframes k9 {
  0% { opacity: 0; transform: translateX(-2.0833cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  34% { opacity: 0; transform: translateX(-2.0833cqw); animation-timing-function: cubic-bezier(.16,1,.3,1); }
  40% { opacity: 1; transform: none; animation-timing-function: cubic-bezier(.22,1,.36,1); }
  93% { opacity: 1; transform: none; animation-timing-function: cubic-bezier(.55,0,1,.45); }
  99% { opacity: 0; transform: none; animation-timing-function: linear; }
  100% { opacity: 0; transform: none; animation-timing-function: linear; }
}
@keyframes k10 {
  0% { opacity: 0; transform: scale(0); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  42% { opacity: 0; transform: scale(0); animation-timing-function: cubic-bezier(.34,1.56,.64,1); }
  45% { opacity: 1; transform: none; animation-timing-function: linear; }
  100% { opacity: 1; transform: none; animation-timing-function: linear; }
}
@keyframes k11 {
  0% { stroke-dashoffset: 100; animation-timing-function: cubic-bezier(.22,1,.36,1); }
  43% { stroke-dashoffset: 100; animation-timing-function: cubic-bezier(.65,0,.35,1); }
  50% { stroke-dashoffset: 0; animation-timing-function: linear; }
  100% { stroke-dashoffset: 0; animation-timing-function: linear; }
}
@keyframes k12 {
  0% { opacity: 0; transform: translateX(2.0833cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  48% { opacity: 0; transform: translateX(2.0833cqw); animation-timing-function: cubic-bezier(.16,1,.3,1); }
  54% { opacity: 1; transform: none; animation-timing-function: cubic-bezier(.22,1,.36,1); }
  93% { opacity: 1; transform: none; animation-timing-function: cubic-bezier(.55,0,1,.45); }
  99% { opacity: 0; transform: none; animation-timing-function: linear; }
  100% { opacity: 0; transform: none; animation-timing-function: linear; }
}
@keyframes k13 {
  0% { opacity: 0; transform: scale(0); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  56% { opacity: 0; transform: scale(0); animation-timing-function: cubic-bezier(.34,1.56,.64,1); }
  59% { opacity: 1; transform: none; animation-timing-function: linear; }
  100% { opacity: 1; transform: none; animation-timing-function: linear; }
}
@keyframes k14 {
  0% { stroke-dashoffset: 100; animation-timing-function: cubic-bezier(.22,1,.36,1); }
  57% { stroke-dashoffset: 100; animation-timing-function: cubic-bezier(.65,0,.35,1); }
  64% { stroke-dashoffset: 0; animation-timing-function: linear; }
  100% { stroke-dashoffset: 0; animation-timing-function: linear; }
}
@keyframes k15 {
  0% { opacity: 0; transform: translateX(-2.0833cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  62% { opacity: 0; transform: translateX(-2.0833cqw); animation-timing-function: cubic-bezier(.16,1,.3,1); }
  68% { opacity: 1; transform: none; animation-timing-function: cubic-bezier(.22,1,.36,1); }
  93% { opacity: 1; transform: none; animation-timing-function: cubic-bezier(.55,0,1,.45); }
  99% { opacity: 0; transform: none; animation-timing-function: linear; }
  100% { opacity: 0; transform: none; animation-timing-function: linear; }
}
@keyframes k16 {
  0% { opacity: 1; animation-timing-function: cubic-bezier(.22,1,.36,1); }
  93% { opacity: 1; animation-timing-function: cubic-bezier(.55,0,1,.45); }
  99% { opacity: 0; animation-timing-function: linear; }
  100% { opacity: 0; animation-timing-function: linear; }
}
#phone { animation: k1 var(--film) linear infinite both; }
#amt { animation: k2 var(--film) linear infinite both; }
#cap { animation: k3 var(--film) linear infinite both; }
#w1 { animation: k4 var(--film) linear infinite both; }
#w2 { animation: k5 var(--film) linear infinite both; }
#w3 { animation: k6 var(--film) linear infinite both; }
#o1 { animation: k7 var(--film) linear infinite both; }
#p1 { animation: k8 var(--film) linear infinite both; }
#l1 { animation: k9 var(--film) linear infinite both; }
#o2 { animation: k10 var(--film) linear infinite both; }
#p2 { animation: k11 var(--film) linear infinite both; }
#l2 { animation: k12 var(--film) linear infinite both; }
#o3 { animation: k13 var(--film) linear infinite both; }
#p3 { animation: k14 var(--film) linear infinite both; }
#l3 { animation: k15 var(--film) linear infinite both; }
.lines { animation: k16 var(--film) linear infinite both; }
</style>
</head>
<body>
<div id="stage" data-composition-id="main" data-start="0" data-duration="10"
  data-width="1920" data-height="1080" data-fps="30" data-poster-time="6">
<svg class="lines" viewBox="0 0 1920 1080" aria-hidden="true">
  <path id="p1" d="M820 330 L640 250 L470 250" pathLength="100"/><circle id="o1" cx="820" cy="330" r="10"/>
  <path id="p2" d="M1100 560 L1280 470 L1450 470" pathLength="100"/><circle id="o2" cx="1100" cy="560" r="10"/>
  <path id="p3" d="M840 760 L640 840 L470 840" pathLength="100"/><circle id="o3" cx="840" cy="760" r="10"/>
</svg>
<div class="phone" id="phone"><div class="screen">
  <div class="bal" id="bal">This month</div><div class="amt">€<span class="num" id="amt"></span></div>
  <div class="cap"><i id="cap"></i></div>
  <div class="row" id="w1"><i></i><b></b></div><div class="row" id="w2"><i style="background:#f2a541"></i><b></b></div><div class="row" id="w3"><i style="background:#5b8def"></i><b></b></div>
</div></div>
<div class="lab" id="l1" style="left:120px;top:200px">Split bills in one tap<small>Send a share to anyone</small></div>
<div class="lab" id="l2" style="left:1470px;top:420px">Smart monthly caps<small>Nudges before you overspend</small></div>
<div class="lab" id="l3" style="left:120px;top:790px">Works offline<small>Syncs when you're back</small></div>
</div>
<script>
// Master timeline. The renderer pauses it and calls seek(t) for every frame;
// seek pins each CSS animation of the film to t, so the film is the same on
// every render. Without scripts (the gallery preview) the CSS loops alone.
(() => {
  const DURATION = 10;
  const all = () => (document.getAnimations ? document.getAnimations() : []);
  const timeline = {
    duration: () => DURATION,
    pause() { all().forEach((a) => a.pause()); return timeline; },
    play() { all().forEach((a) => a.play()); return timeline; },
    seek(t) {
      const ms = Math.min(Math.max(Number(t) || 0, 0), DURATION) * 1000;
      all().forEach((a) => { a.pause(); a.currentTime = ms; });
      return timeline;
    },
  };
  window.__timelines = window.__timelines || {};
  window.__timelines.main = timeline;
})();
</script>
</body>
