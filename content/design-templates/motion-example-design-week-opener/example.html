<style>
/* Example: design week opener: a 12 s, 1920x1080 HyperFrames composition.
   Every movement is a CSS animation that spans the whole film (--film) and
   loops; keyframe percentages are fractions of the 12 s film
   (1 s = 8.333%). The master timeline below pins every
   animation to the renderer's time. Sizes are in cqw (1cqw = 19.2px
   on the 1920px grid), so the stage scales to any preview. System fonts
   and inline SVG only: nothing is downloaded. */
@property --n { syntax: '<integer>'; inherits: false; initial-value: 0; }
html, body { margin: 0; height: 100%; background: #111111; overflow: hidden; }
body { display: grid; place-items: center; }
#stage {
  --film: 12s;
  position: relative; overflow: hidden; container-type: size;
  width: min(100vw, calc(100vh * 1920 / 1080)); aspect-ratio: 1920 / 1080;
  background: #111111; color: #f5f2ea; font-family: ui-sans-serif, -apple-system, "Helvetica Neue", "Segoe UI", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
#stage * { box-sizing: border-box; }

  linear-gradient(90deg, rgba(245,242,234,.07) 0.1042cqw, rgba(0,0,0,0) 0.1042cqw) 0 0 / 8.3333cqw 100%,

<body>
<div id="stage" data-composition-id="main" data-start="0" data-duration="12"
  data-width="1920" data-height="1080" data-fps="30" data-poster-time="7.2">
<div class="gridlines" id="gl"></div>
<i class="blk" id="q1" style="right:5.2083cqw;top:5.2083cqw;background:#e63b2e"></i>

  <div class="nm"><span id="L1">N</span><span id="L2">O</span><span id="L3">R</span><span id="L4">T</span><span id="L5">H</span><span id="L6">W</span><span id="L7">I</span><span id="L8">N</span><span id="L9">D</span></div>

</div>

</div>
<script>
// Master timeline. The renderer pauses it and calls seek(t) for every frame;
// seek pins each CSS animation of the film to t, so the film is the same on
// every render. Without scripts (the gallery preview) the CSS loops alone.
(() => {
  const DURATION = 12;
  const all = () => (document.getAnimations ? document.getAnimations() : []);
  const timeline = {
    duration: () => DURATION,
    pause() { all().forEach((a) => a.pause()); return timeline; },
    play() { all().forEach((a) => a.play()); return timeline; },
    seek(t) {
      const ms = Math.min(Math.max(Number(t) || 0, 0), DURATION) * 1000;
      all().forEach((a) => { a.pause(); a.currentTime = ms; });
      return timeline;
    },
  };
  window.__timelines = window.__timelines || {};
  window.__timelines.main = timeline;
})();
</script>
