<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>End screen</title>
<meta name="od-motion-output" content="video">
<meta name="od-motion-audio" content="silent">
<style>
/* End screen: a 8 s, 1920x1080 HyperFrames composition.
   Every movement is a CSS animation that spans the whole film (--film) and
   loops; keyframe percentages are fractions of the 8 s film
   (1 s = 12.500%). The master timeline below pins every
   animation to the renderer's time. Sizes are in cqw (1cqw = 19.2px
   on the 1920px grid), so the stage scales to any preview. System fonts
   and inline SVG only: nothing is downloaded. */
@property --n { syntax: '<integer>'; inherits: false; initial-value: 0; }
html, body { margin: 0; height: 100%; background: #121a33; overflow: hidden; }
body { display: grid; place-items: center; }
#stage {
  --film: 8s;
  position: relative; overflow: hidden; container-type: size;
  width: min(100vw, calc(100vh * 1920 / 1080)); aspect-ratio: 1920 / 1080;
  background: #121a33; color: #f2f4ff; font-family: ui-sans-serif, -apple-system, "Helvetica Neue", "Segoe UI", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
#stage * { box-sizing: border-box; }

.wrap { position: absolute; inset: 0; padding: 5.7292cqw 6.7708cqw; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr; gap: 2.6042cqw 3.6458cqw; }
h1 { grid-column: 1 / 3; margin: 0; font-size: 5cqw; font-weight: 900; letter-spacing: -0.1562cqw; }
.left { display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 2.0833cqw; }
.avatar { width: 13.5417cqw; height: 13.5417cqw; border-radius: 50%; border: 0.4167cqw dashed #4d5c96; display: grid; place-items: center; color: #8d98c8; font-size: 1.3542cqw; font-weight: 600; }
.sub { padding: 1.4583cqw 2.9167cqw; border-radius: 0.8333cqw; background: #ff6f61; color: #121a33; font-size: 2.1875cqw; font-weight: 800; }
.right { display: flex; flex-direction: column; gap: 2.0833cqw; justify-content: center; }
.slot { display: flex; gap: 1.5625cqw; align-items: center; }
.thumb { width: 19.7917cqw; aspect-ratio: 16 / 9; border-radius: 0.9375cqw; background: #1d2850; border: 0.2083cqw solid #4d5c96; position: relative; }
.thumb::after { content: ''; position: absolute; left: 50%; top: 50%; margin: -1.25cqw 0 0 -0.8333cqw; border-left: 2.0833cqw solid #8d98c8; border-top: 1.25cqw solid transparent; border-bottom: 1.25cqw solid transparent; }
.st { font-size: 1.875cqw; font-weight: 700; line-height: 1.15; }
.st small { display: block; font: 600 1.1458cqw/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: #8d98c8; letter-spacing: 0.2083cqw; margin-bottom: 0.625cqw; }
.orb { position: absolute; width: 36.4583cqw; height: 36.4583cqw; right: -10.4167cqw; top: -13.5417cqw; border-radius: 50%; background: radial-gradient(circle, rgba(255,111,97,.28), rgba(255,111,97,0) 65%); }

@keyframes k1 {
  0% { transform: scale(.9); animation-timing-function: linear; }
  100% { transform: scale(1.15); animation-timing-function: linear; }
}
@keyframes k2 {
  0% { opacity: 0; transform: translateY(-2.6042cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  2.5% { opacity: 0; transform: translateY(-2.6042cqw); animation-timing-function: cubic-bezier(.16,1,.3,1); }
  11.25% { opacity: 1; transform: none; animation-timing-function: linear; }
  100% { opacity: 1; transform: none; animation-timing-function: linear; }
}
@keyframes k3 {
  0% { opacity: 0; transform: scale(.5); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  8.75% { opacity: 0; transform: scale(.5); animation-timing-function: cubic-bezier(.34,1.56,.64,1); }
  17.5% { opacity: 1; transform: none; animation-timing-function: linear; }
  100% { opacity: 1; transform: none; animation-timing-function: linear; }
}
@keyframes k4 {
  0% { opacity: 0; transform: translateY(2.0833cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  13.75% { opacity: 0; transform: translateY(2.0833cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  21.25% { opacity: 1; transform: none; animation-timing-function: cubic-bezier(.22,1,.36,1); }
  30% { opacity: 1; transform: scale(1); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  32.5% { opacity: 1; transform: scale(1.08); animation-timing-function: cubic-bezier(.4,0,.2,1); }
  35.625% { opacity: 1; transform: scale(1); animation-timing-function: linear; }
  100% { opacity: 1; transform: scale(1); animation-timing-function: linear; }
}
@keyframes k5 {
  0% { opacity: 0; transform: translateX(10.4167cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  11.25% { opacity: 0; transform: translateX(10.4167cqw); animation-timing-function: cubic-bezier(.16,1,.3,1); }
  20% { opacity: 1; transform: none; animation-timing-function: linear; }
  100% { opacity: 1; transform: none; animation-timing-function: linear; }
}
@keyframes k6 {
  0% { opacity: 0; transform: translateX(10.4167cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  14.375% { opacity: 0; transform: translateX(10.4167cqw); animation-timing-function: cubic-bezier(.16,1,.3,1); }
  23.125% { opacity: 1; transform: none; animation-timing-function: linear; }
  100% { opacity: 1; transform: none; animation-timing-function: linear; }
}
@keyframes k7 {
  0% { opacity: 1; animation-timing-function: cubic-bezier(.22,1,.36,1); }
  92.5% { opacity: 1; animation-timing-function: cubic-bezier(.55,0,1,.45); }
  98.75% { opacity: 0; animation-timing-function: linear; }
  100% { opacity: 0; animation-timing-function: linear; }
}
#orb { animation: k1 var(--film) linear infinite both; }
#h { animation: k2 var(--film) linear infinite both; }
#av { animation: k3 var(--film) linear infinite both; }
#sub { animation: k4 var(--film) linear infinite both; }
#v1 { animation: k5 var(--film) linear infinite both; }
#v2 { animation: k6 var(--film) linear infinite both; }
.wrap { animation: k7 var(--film) linear infinite both; }
</style>
</head>
<body>
<div id="stage" data-composition-id="main" data-start="0" data-duration="8"
  data-width="1920" data-height="1080" data-fps="30" data-poster-time="4">
<div class="orb" id="orb"></div>
<div class="wrap">
  <h1 id="h">Thanks for watching</h1>
  <div class="left"><div class="avatar" id="av">YOUR AVATAR</div><div class="sub" id="sub">Subscribe</div></div>
  <div class="right">
    <div class="slot" id="v1"><div class="thumb"></div><div class="st"><small>WATCH NEXT</small>Part 2: Wiring it up</div></div>
    <div class="slot" id="v2"><div class="thumb"></div><div class="st"><small>ALSO GOOD</small>Tools I use</div></div>
  </div>
</div>
</div>
<script>
// Master timeline. The renderer pauses it and calls seek(t) for every frame;
// seek pins each CSS animation of the film to t, so the film is the same on
// every render. Without scripts (the gallery preview) the CSS loops alone.
(() => {
  const DURATION = 8;
  const all = () => (document.getAnimations ? document.getAnimations() : []);
  const timeline = {
    duration: () => DURATION,
    pause() { all().forEach((a) => a.pause()); return timeline; },
    play() { all().forEach((a) => a.play()); return timeline; },
    seek(t) {
      const ms = Math.min(Math.max(Number(t) || 0, 0), DURATION) * 1000;
      all().forEach((a) => { a.pause(); a.currentTime = ms; });
      return timeline;
    },
  };
  window.__timelines = window.__timelines || {};
  window.__timelines.main = timeline;
})();
</script>
</body>
</html>
