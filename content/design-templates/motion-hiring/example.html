<style>
/* We're hiring: a 10 s, 1920x1080 HyperFrames composition.
   Every movement is a CSS animation that spans the whole film (--film) and
   loops; keyframe percentages are fractions of the 10 s film
   (1 s = 10%). The master timeline below pins every
   animation to the renderer's time. Sizes are in cqw (1cqw = 19.2px
   on the 1920px grid), so the stage scales to any preview. System fonts
   and inline SVG only: nothing is downloaded. */
html, body { margin: 0; height: 100%; background: #1446ff; overflow: hidden; }
body { display: grid; place-items: center; }
#stage {
  --film: 10s;
  position: relative; overflow: hidden; container-type: size;
  width: min(100vw, calc(100vh * 1920 / 1080)); aspect-ratio: 1920 / 1080;
  background: #1446ff; color: #ffffff; font-family: ui-sans-serif, -apple-system, "Helvetica Neue", "Segoe UI", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
#stage * { box-sizing: border-box; }

.big { position: absolute; left: 6.25cqw; top: 10.4167cqw; }
.big div { overflow: hidden; padding-bottom: 2.0833cqw; margin-bottom: -2.0833cqw; }
.big span { display: block; font-size: 10.9375cqw; font-weight: 900; letter-spacing: -0.4167cqw; line-height: .92; }
.big .f { color: #b8f5a0; }
.lead { position: absolute; left: 6.5625cqw; top: 33.3333cqw; width: 33.3333cqw; font-size: 1.9792cqw; line-height: 1.35; color: #c9d4ff; }
.studio { position: absolute; left: 6.5625cqw; bottom: 4.6875cqw; font: 700 1.3542cqw/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 0.3125cqw; color: #c9d4ff; }
.roles { position: absolute; left: 50cqw; top: 9.8958cqw; width: 43.75cqw; display: flex; flex-direction: column; gap: 1.4583cqw; }
.role { padding: 1.875cqw 2.2917cqw; border-radius: 1.4583cqw; background: #ffffff; color: #0d1440; display: flex; align-items: center; justify-content: space-between; }
.role strong { display: block; font-size: 2.2917cqw; font-weight: 800; letter-spacing: -0.0521cqw; margin-bottom: 0.625cqw; }
.tags span { display: inline-block; margin-right: 0.5208cqw; padding: 0.4167cqw 0.8333cqw; border-radius: 1.0417cqw; background: #eef1ff; font: 600 1.1458cqw/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: #1446ff; }
.arrow { width: 3.9583cqw; height: 3.9583cqw; border-radius: 50%; background: #1446ff; flex: none; display: grid; place-items: center; }
.arrow svg { width: 1.875cqw; height: 1.875cqw; }
.cta { position: absolute; left: 50cqw; top: 42.7083cqw; display: flex; align-items: center; gap: 1.25cqw; font-size: 2.0833cqw; font-weight: 700; }

.leaf { position: absolute; right: -4.1667cqw; bottom: -6.25cqw; width: 27.0833cqw; height: 27.0833cqw; opacity: .22; }

@keyframes k1 {
  0% { transform: rotate(-12deg); animation-timing-function: linear; }
  100% { transform: rotate(8deg); animation-timing-function: linear; }
}

  0% { transform: translateY(105%); animation-timing-function: linear; }
  3% { transform: translateY(105%); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  9% { transform: none; animation-timing-function: linear; }
  92% { transform: none; animation-timing-function: cubic-bezier(.55,0,1,.45); }
  96% { transform: translateY(-105%); animation-timing-function: linear; }
  100% { transform: translateY(-105%); animation-timing-function: linear; }
}

  100% { transform: translateY(-105%); animation-timing-function: linear; }
}

  27.5% { opacity: 0; transform: translateX(10.4167cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  33.5% { opacity: 1; transform: none; animation-timing-function: linear; }
  53% { opacity: 1; transform: none; animation-timing-function: cubic-bezier(.4,0,.2,1); }

  66% { opacity: 1; transform: none; animation-timing-function: linear; }
  91% { opacity: 1; transform: none; animation-timing-function: cubic-bezier(.55,0,1,.45); }

  70% { opacity: 0; transform: translateY(1.5625cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  77% { opacity: 1; transform: none; animation-timing-function: linear; }
  92% { opacity: 1; transform: none; animation-timing-function: cubic-bezier(.55,0,1,.45); }
  96% { opacity: 0; transform: translateY(1.5625cqw); animation-timing-function: linear; }
  100% { opacity: 0; transform: translateY(1.5625cqw); animation-timing-function: linear; }
}
#leaf { animation: k1 var(--film) linear infinite both; }
#h1 { animation: k2 var(--film) linear infinite both; }
#h2 { animation: k3 var(--film) linear infinite both; }
#lead { animation: k4 var(--film) linear infinite both; }

<script>
// Master timeline. The renderer pauses it and calls seek(t) for every frame;
// seek pins each CSS animation of the film to t, so the film is the same on
// every render. Without scripts (the gallery preview) the CSS loops alone.
(() => {
  const DURATION = 10;
  const all = () => (document.getAnimations ? document.getAnimations() : []);
  const timeline = {
    duration: () => DURATION,
    pause() { all().forEach((a) => a.pause()); return timeline; },
    play() { all().forEach((a) => a.play()); return timeline; },
    seek(t) {
      const ms = Math.min(Math.max(Number(t) || 0, 0), DURATION) * 1000;
      all().forEach((a) => { a.pause(); a.currentTime = ms; });
      return timeline;
    },
  };
  window.__timelines = window.__timelines || {};
  window.__timelines.main = timeline;
})();
</script>
