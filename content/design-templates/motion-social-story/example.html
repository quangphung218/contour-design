<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vertical social story</title>
<meta name="od-motion-output" content="video">
<meta name="od-motion-audio" content="silent">
<style>
/* Vertical social story: a 10 s, 1080x1920 HyperFrames composition.
   Every movement is a CSS animation that spans the whole film (--film) and
   loops; keyframe percentages are fractions of the 10 s film
   (1 s = 10.000%). The master timeline below pins every
   animation to the renderer's time. Sizes are in cqw (1cqw = 10.8px
   on the 1080px grid), so the stage scales to any preview. System fonts
   and inline SVG only: nothing is downloaded. */
@property --n { syntax: '<integer>'; inherits: false; initial-value: 0; }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
body { display: grid; place-items: center; }
#stage {
  --film: 10s;
  position: relative; overflow: hidden; container-type: size;
  width: min(100vw, calc(100vh * 1080 / 1920)); aspect-ratio: 1080 / 1920;
  background: #ff6b2c; color: #1c1410; font-family: ui-sans-serif, -apple-system, "Helvetica Neue", "Segoe UI", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
#stage * { box-sizing: border-box; }

.card { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 14.8148cqw 8.3333cqw; gap: 3.7037cqw; }
.c1 { background: #ff6b2c; }
.c2 { background: #fff4e6; }
.c3 { background: #1c1410; color: #fff4e6; }
.kick { font: 700 3.1481cqw/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 0.7407cqw; }
.huge { font-size: 21.2963cqw; font-weight: 900; line-height: .86; letter-spacing: -0.7407cqw; }
.prod { align-self: center; width: 59.2593cqw; height: 70.3704cqw; border-radius: 4.4444cqw; background: #ff6b2c; position: relative; display: grid; place-items: center; }
.tote { width: 38.8889cqw; height: 42.5926cqw; }
.sticker { position: absolute; right: -4.6296cqw; top: -4.6296cqw; width: 22.2222cqw; height: 22.2222cqw; border-radius: 50%; background: #1c1410; color: #fff4e6;
  display: grid; place-items: center; font-size: 7.037cqw; font-weight: 900; }
.pname { font-size: 6.6667cqw; font-weight: 800; letter-spacing: -0.0926cqw; text-align: center; }
.pname small { display: block; font-size: 3.3333cqw; font-weight: 500; color: #7a5b45; margin-top: 1.1111cqw; letter-spacing: 0; }
.cta { font-size: 11.1111cqw; font-weight: 900; line-height: .95; letter-spacing: -0.2778cqw; }
.btn { align-self: flex-start; padding: 3.1481cqw 5.5556cqw; border-radius: 92.5cqw; background: #ff6b2c; color: #1c1410; font-size: 4.2593cqw; font-weight: 800; }
.arrow { width: 11.1111cqw; height: 11.1111cqw; align-self: flex-start; }
.arrow path { fill: none; stroke: #ff6b2c; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
.bars { position: absolute; left: 3.7037cqw; right: 3.7037cqw; top: 3.7037cqw; display: flex; gap: 1.1111cqw; z-index: 5; }
.seg { flex: 1; height: 0.9259cqw; border-radius: 0.463cqw; background: rgba(28,20,16,.22); overflow: hidden; }
.seg i { display: block; height: 100%; background: #1c1410; transform-origin: left; }

@keyframes k1 {
  0% { transform: scaleX(0); animation-timing-function: linear; }
  33% { transform: scaleX(1); animation-timing-function: linear; }
  100% { transform: scaleX(1); animation-timing-function: linear; }
}
@keyframes k2 {
  0% { transform: scaleX(0); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  33% { transform: scaleX(0); animation-timing-function: linear; }
  66% { transform: scaleX(1); animation-timing-function: linear; }
  100% { transform: scaleX(1); animation-timing-function: linear; }
}
@keyframes k3 {
  0% { transform: scaleX(0); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  66% { transform: scaleX(0); animation-timing-function: linear; }
  100% { transform: scaleX(1); animation-timing-function: linear; }
}
@keyframes k4 {
  0% { filter: invert(0); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  66% { filter: invert(0); animation-timing-function: cubic-bezier(.4,0,.2,1); }
  69% { filter: invert(1); animation-timing-function: linear; }
  100% { filter: invert(1); animation-timing-function: linear; }
}
@keyframes k5 {
  0% { opacity: 0; transform: translateY(-2.7778cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  2% { opacity: 0; transform: translateY(-2.7778cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  8% { opacity: 1; transform: none; animation-timing-function: linear; }
  100% { opacity: 1; transform: none; animation-timing-function: linear; }
}
@keyframes k6 {
  0% { transform: translateX(-101.8519cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  3.5% { transform: translateX(-101.8519cqw); animation-timing-function: cubic-bezier(.16,1,.3,1); }
  9.5% { transform: none; animation-timing-function: linear; }
  100% { transform: none; animation-timing-function: linear; }
}
@keyframes k7 {
  0% { transform: translateX(101.8519cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  5.5% { transform: translateX(101.8519cqw); animation-timing-function: cubic-bezier(.16,1,.3,1); }
  11.5% { transform: none; animation-timing-function: linear; }
  100% { transform: none; animation-timing-function: linear; }
}
@keyframes k8 {
  0% { transform: translateY(0cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  31% { transform: translateY(0cqw); animation-timing-function: cubic-bezier(.65,0,.35,1); }
  36% { transform: translateY(-177.7778cqw); animation-timing-function: linear; }
  100% { transform: translateY(-177.7778cqw); animation-timing-function: linear; }
}
@keyframes k9 {
  0% { transform: translateY(177.7778cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  31% { transform: translateY(177.7778cqw); animation-timing-function: cubic-bezier(.65,0,.35,1); }
  36% { transform: translateY(0cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  64% { transform: translateY(0cqw); animation-timing-function: cubic-bezier(.65,0,.35,1); }
  69% { transform: translateY(-177.7778cqw); animation-timing-function: linear; }
  100% { transform: translateY(-177.7778cqw); animation-timing-function: linear; }
}
@keyframes k10 {
  0% { transform: scale(.8) rotate(-4deg); opacity: 0; animation-timing-function: cubic-bezier(.22,1,.36,1); }
  35% { transform: scale(.8) rotate(-4deg); opacity: 0; animation-timing-function: cubic-bezier(.34,1.56,.64,1); }
  42% { transform: none; opacity: 1; animation-timing-function: linear; }
  100% { transform: none; opacity: 1; animation-timing-function: linear; }
}
@keyframes k11 {
  0% { transform: scale(0) rotate(-30deg); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  41% { transform: scale(0) rotate(-30deg); animation-timing-function: cubic-bezier(.34,1.56,.64,1); }
  46% { transform: none; animation-timing-function: linear; }
  100% { transform: none; animation-timing-function: linear; }
}
@keyframes k12 {
  0% { opacity: 0; transform: translateY(3.7037cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  40% { opacity: 0; transform: translateY(3.7037cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  46% { opacity: 1; transform: none; animation-timing-function: linear; }
  100% { opacity: 1; transform: none; animation-timing-function: linear; }
}
@keyframes k13 {
  0% { transform: translateY(177.7778cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  64% { transform: translateY(177.7778cqw); animation-timing-function: cubic-bezier(.65,0,.35,1); }
  69% { transform: translateY(0cqw); animation-timing-function: linear; }
  100% { transform: translateY(0cqw); animation-timing-function: linear; }
}
@keyframes k14 {
  0% { opacity: 0; transform: translateY(5.5556cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  69% { opacity: 0; transform: translateY(5.5556cqw); animation-timing-function: cubic-bezier(.16,1,.3,1); }
  76% { opacity: 1; transform: none; animation-timing-function: linear; }
  100% { opacity: 1; transform: none; animation-timing-function: linear; }
}
@keyframes k15 {
  0% { opacity: 0; transform: translateY(2.7778cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  73% { opacity: 0; transform: translateY(2.7778cqw); animation-timing-function: cubic-bezier(.65,0,.35,1); }
  76% { opacity: 1; transform: translateY(-1.4815cqw); animation-timing-function: cubic-bezier(.65,0,.35,1); }
  81% { opacity: 1; transform: translateY(0cqw); animation-timing-function: cubic-bezier(.65,0,.35,1); }
  86% { opacity: 1; transform: translateY(-1.4815cqw); animation-timing-function: cubic-bezier(.65,0,.35,1); }
  91% { opacity: 1; transform: translateY(0cqw); animation-timing-function: cubic-bezier(.65,0,.35,1); }
  96% { opacity: 1; transform: translateY(-1.4815cqw); animation-timing-function: linear; }
  100% { opacity: 1; transform: translateY(-1.4815cqw); animation-timing-function: linear; }
}
@keyframes k16 {
  0% { opacity: 0; transform: scale(.7); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  75% { opacity: 0; transform: scale(.7); animation-timing-function: cubic-bezier(.34,1.56,.64,1); }
  81% { opacity: 1; transform: none; animation-timing-function: linear; }
  100% { opacity: 1; transform: none; animation-timing-function: linear; }
}
#g1 { animation: k1 var(--film) linear infinite both; }
#g2 { animation: k2 var(--film) linear infinite both; }
#g3 { animation: k3 var(--film) linear infinite both; }
.bars { animation: k4 var(--film) linear infinite both; }
#k1 { animation: k5 var(--film) linear infinite both; }
#h1 { animation: k6 var(--film) linear infinite both; }
#h2 { animation: k7 var(--film) linear infinite both; }
#c1 { animation: k8 var(--film) linear infinite both; }
#c2 { animation: k9 var(--film) linear infinite both; }
#prod { animation: k10 var(--film) linear infinite both; }
#tag { animation: k11 var(--film) linear infinite both; }
#pname { animation: k12 var(--film) linear infinite both; }
#c3 { animation: k13 var(--film) linear infinite both; }
#cta { animation: k14 var(--film) linear infinite both; }
#arrow { animation: k15 var(--film) linear infinite both; }
#btn { animation: k16 var(--film) linear infinite both; }
</style>
</head>
<body>
<div id="stage" data-composition-id="main" data-start="0" data-duration="10"
  data-width="1080" data-height="1920" data-fps="30" data-poster-time="4.6">
<div class="card c1" id="c1"><div class="kick" id="k1">SPRING · 2027</div><div class="huge" id="h1">New</div><div class="huge" id="h2">drop.</div></div>
<div class="card c2" id="c2">
  <div class="prod" id="prod">
    <svg class="tote" viewBox="0 0 120 130" aria-hidden="true"><path d="M30 40 C30 10 90 10 90 40" fill="none" stroke="#1c1410" stroke-width="6"/><rect x="12" y="40" width="96" height="84" rx="8" fill="#fff4e6"/><rect x="12" y="40" width="96" height="16" fill="#1c1410"/></svg>
    <div class="sticker" id="tag">€49</div>
  </div>
  <div class="pname" id="pname">Fold Tote<small>Recycled canvas, folds flat</small></div>
</div>
<div class="card c3" id="c3">
  <div class="cta" id="cta">Tap the link to shop</div>
  <svg class="arrow" id="arrow" viewBox="0 0 60 60"><path d="M30 52 L30 10 M14 26 L30 10 L46 26"/></svg>
  <div class="btn" id="btn">Shop the drop</div>
</div>
<div class="bars"><div class="seg"><i id="g1"></i></div><div class="seg"><i id="g2"></i></div><div class="seg"><i id="g3"></i></div></div>
</div>
<script>
// Master timeline. The renderer pauses it and calls seek(t) for every frame;
// seek pins each CSS animation of the film to t, so the film is the same on
// every render. Without scripts (the gallery preview) the CSS loops alone.
(() => {
  const DURATION = 10;
  const all = () => (document.getAnimations ? document.getAnimations() : []);
  const timeline = {
    duration: () => DURATION,
    pause() { all().forEach((a) => a.pause()); return timeline; },
    play() { all().forEach((a) => a.play()); return timeline; },
    seek(t) {
      const ms = Math.min(Math.max(Number(t) || 0, 0), DURATION) * 1000;
      all().forEach((a) => { a.pause(); a.currentTime = ms; });
      return timeline;
    },
  };
  window.__timelines = window.__timelines || {};
  window.__timelines.main = timeline;
})();
</script>
</body>
</html>
