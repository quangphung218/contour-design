<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orrin One · Rotating 3D product</title>
<style>
:root{--bg:#efe6da;--fg:#23201b;--accent:#55705d;--font:'Avenir Next',Avenir,'Helvetica Neue',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);overflow:hidden}
body{font-family:var(--font, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif)}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .8s ease}
html.gl-on #gl{opacity:1}
.fallback{position:fixed;inset:0;overflow:hidden}
html.gl-on .fallback{visibility:hidden;transition:visibility 0s .8s}
.fallback svg{position:absolute;inset:0;width:100%;height:100%}
.gl-note{display:none;position:fixed;right:20px;bottom:18px;z-index:3;font:12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;padding:6px 10px;border-radius:6px;background:rgba(0,0,0,.45);color:#fff}
html.gl-off .gl-note{display:block}
.overlay{position:fixed;z-index:2;pointer-events:none}
.overlay a,.overlay button{pointer-events:auto}
@media (prefers-reduced-motion: reduce){#gl{transition:none}}
.overlay.name{left:6vw;top:14vh;max-width:30rem}
.kicker{font:500 .78rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
h1{margin-top:1rem;font-weight:600;font-size:clamp(2.8rem,6.5vw,5.8rem);letter-spacing:-.035em;line-height:.95}
.sub{margin-top:1.2rem;font-size:1.1rem;line-height:1.5;color:#4e473e;max-width:24rem}
.price{margin-top:1.6rem;display:flex;gap:1.2rem;align-items:center}
.price b{font-size:1.6rem;font-weight:600}
.cta{padding:.8rem 1.4rem;border-radius:999px;background:#23201b;color:#efe6da;text-decoration:none;font-size:.95rem}
.overlay.specs{left:6vw;bottom:8vh;display:grid;grid-template-columns:repeat(3,minmax(0,9rem));gap:1.4rem;font:.78rem/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:#4e473e}
.specs b{display:block;font:600 1.3rem/1.2 'Avenir Next',Avenir,sans-serif;color:#23201b}
</style>
</head>
<body>
<div class="fallback" aria-hidden="true" data-webgl-fallback>
<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#efe6da"/><stop offset="1" stop-color="#d8cab8"/></linearGradient>
    <linearGradient id="fab" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5f7064"/><stop offset=".35" stop-color="#8fa192"/><stop offset="1" stop-color="#4f5d53"/></linearGradient>
    <linearGradient id="met" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a9a49c"/><stop offset=".4" stop-color="#e2ded7"/><stop offset="1" stop-color="#8f8a83"/></linearGradient>
    <pattern id="rib" width="14" height="10" patternUnits="userSpaceOnUse"><rect width="7" height="10" fill="rgba(0,0,0,.08)"/></pattern>
    <radialGradient id="shade"><stop offset="0" stop-color="rgba(60,45,30,.45)"/><stop offset="1" stop-color="rgba(60,45,30,0)"/></radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sweep)"/>
  <ellipse cx="1060" cy="742" rx="250" ry="34" fill="url(#shade)"/>
  <rect x="880" y="250" width="360" height="490" rx="64" fill="url(#fab)"/>
  <rect x="880" y="250" width="360" height="490" rx="64" fill="url(#rib)"/>
  <path d="M880 330 Q880 250 944 250 H1176 Q1240 250 1240 330 Z" fill="url(#met)"/>
  <rect x="880" y="326" width="360" height="6" fill="#4a463f" opacity=".5"/>
  <ellipse cx="1060" cy="266" rx="20" ry="7" fill="#6d6860"/>
</svg>
</div>
<canvas id="gl" aria-hidden="true"></canvas>
<div class="overlay name">
  <p class="kicker">New · Orrin One</p>
  <h1>Room-filling, shelf-sized.</h1>
  <p class="sub">A 360° speaker wrapped in recycled wool, tuned to sound the same from every seat.</p>
  <div class="price"><b>€249</b><a class="cta" href="#buy">Reserve a unit</a></div>
</div>
<div class="overlay specs">
  <div><b>360°</b>three woofers, one tweeter</div>
  <div><b>20 h</b>battery at room volume</div>
  <div><b>1.4 kg</b>wool and aluminium</div>
</div>
<p class="gl-note" role="status">Static poster: this browser has no WebGL.</p>
<script>
var GLX = (function () {
  var root = document.documentElement;
  function fail(why) {
    root.classList.remove('gl-on');
    root.classList.add('gl-off');
    if (why) console.warn('[webgl] ' + why);
    return null;
  }
  function compile(gl, type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.error(gl.getShaderInfoLog(s));
      return null;
    }
    return s;
  }
  function program(gl, vs, fs) {
    var v = compile(gl, gl.VERTEX_SHADER, vs), f = compile(gl, gl.FRAGMENT_SHADER, fs);
    if (!v || !f) return null;
    var p = gl.createProgram();
    gl.attachShader(p, v); gl.attachShader(p, f); gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(p)); return null; }
    return p;
  }
  function start(setup) {
    var canvas = document.getElementById('gl');
    var gl = null;
    try {
      var opts = { alpha: false, antialias: true, premultipliedAlpha: false };
      gl = canvas.getContext('webgl2', opts) || canvas.getContext('webgl', opts);
    } catch (_) {}
    if (!gl) return fail('no WebGL context; showing the static poster');
    var still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    var pointer = [0.5, 0.5], targetPointer = [0.5, 0.5];
    window.addEventListener('pointermove', function (e) {
      targetPointer = [e.clientX / innerWidth, 1 - e.clientY / innerHeight];
    }, { passive: true });
    var draw = setup(gl, { program: function (vs, fs) { return program(gl, vs, fs); } });
    if (!draw) return fail('shader setup failed; showing the static poster');
    function resize() {
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var w = Math.max(1, Math.round(canvas.clientWidth * dpr));
      var h = Math.max(1, Math.round(canvas.clientHeight * dpr));
      if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
      gl.viewport(0, 0, w, h);
    }
    var t0 = performance.now(), raf = 0, shown = false, lost = false;
    function frame(now) {
      raf = 0;
      if (lost) return;
      resize();
      pointer[0] += (targetPointer[0] - pointer[0]) * 0.06;
      pointer[1] += (targetPointer[1] - pointer[1]) * 0.06;
      var t = still ? 6.0 : (now - t0) / 1000;
      draw(t, [canvas.width, canvas.height], pointer);
      if (!shown) {
        shown = true;
        var err = gl.getError();
        if (err !== gl.NO_ERROR) console.warn('[webgl] getError after first frame: ' + err);
        root.classList.add('gl-on');
      }
      if (!still && !document.hidden) raf = requestAnimationFrame(frame);
    }
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && !raf && !still) raf = requestAnimationFrame(frame);
    });
    window.addEventListener('resize', function () { if (still && !raf) raf = requestAnimationFrame(frame); });
    canvas.addEventListener('webglcontextlost', function (e) { e.preventDefault(); lost = true; fail('context lost'); });
    raf = requestAnimationFrame(frame);
    return gl;
  }
  // Full-screen triangle + one fragment shader with uRes, uTime, uPointer.
  var FS_VERT = 'attribute vec2 aPos; void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }';
  function fragment(src, extra) {
    return start(function (gl, h) {
      var p = h.program(FS_VERT, src);
      if (!p) return null;
      var buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
      var loc = gl.getAttribLocation(p, 'aPos');
      var uRes = gl.getUniformLocation(p, 'uRes');
      var uTime = gl.getUniformLocation(p, 'uTime');
      var uPointer = gl.getUniformLocation(p, 'uPointer');
      return function (t, res, ptr) {
        gl.useProgram(p);
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
        gl.uniform2f(uRes, res[0], res[1]);
        gl.uniform1f(uTime, t);
        if (uPointer) gl.uniform2f(uPointer, ptr[0], ptr[1]);
        if (extra) extra(gl, p, t);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
      };
    });
  }
  // Column-major perspective and look-at for the 3D point scenes.
  function perspective(fovy, aspect, near, far) {
    var f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);
    return [f / aspect, 0, 0, 0, 0, f, 0, 0, 0, 0, (far + near) * nf, -1, 0, 0, 2 * far * near * nf, 0];
  }
  function mul(a, b) {
    var o = new Array(16);
    for (var c = 0; c < 4; c++) for (var r = 0; r < 4; r++) {
      var s = 0;
      for (var k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k];
      o[c * 4 + r] = s;
    }
    return o;
  }
  function lookAt(eye, at, up) {
    function sub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
    function norm(a) { var l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; }
    function cross(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
    function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
    var z = norm(sub(eye, at)), x = norm(cross(up, z)), y = cross(z, x);
    return [x[0], y[0], z[0], 0, x[1], y[1], z[1], 0, x[2], y[2], z[2], 0, -dot(x, eye), -dot(y, eye), -dot(z, eye), 1];
  }
  return { start: start, fragment: fragment, perspective: perspective, mul: mul, lookAt: lookAt };
})();
GLX.fragment([
  'precision highp float;',
  'uniform vec2 uRes;',
  'uniform float uTime;',
  'uniform vec2 uPointer;',
  '',
  '#define STEPS 96',
  'const vec3 FABRIC = vec3(0.50, 0.57, 0.51);',
  'const vec3 METAL = vec3(0.78, 0.75, 0.71);',
  'mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }',
  'float sdRoundCyl(vec3 p, float r, float h, float rr){',
  '  vec2 d = vec2(length(p.xz) - r + rr, abs(p.y) - h + rr);',
  '  return min(max(d.x, d.y), 0.0) + length(max(d, 0.0)) - rr;',
  '}',
  'float body(vec3 p){',
  '  float d = sdRoundCyl(p, 0.55, 0.9, 0.14);',
  '  float ring = max(abs(p.y - 0.58) - 0.012, -(length(p.xz) - 0.52));',
  '  d = max(d, -ring);',
  '  float button = length(p - vec3(0.0, 0.9, 0.0)) - 0.07;',
  '  return min(d, button);',
  '}',
  'float floorD(vec3 p){ return p.y + 0.9; }',
  'float map(vec3 p, float ang){',
  '  vec3 q = p; q.xz = rot(ang) * q.xz;',
  '  return min(body(q), floorD(p));',
  '}',
  'float ANG;',
  'float scene(vec3 p){ return map(p, ANG); }',
  'vec3 normal(vec3 p){',
  '  vec2 e = vec2(0.0015, 0.0);',
  '  return normalize(vec3(scene(p + e.xyy) - scene(p - e.xyy), scene(p + e.yxy) - scene(p - e.yxy), scene(p + e.yyx) - scene(p - e.yyx)));',
  '}',
  'float shadow(vec3 ro, vec3 rd){',
  '  float res = 1.0, t = 0.02;',
  '  for (int i = 0; i < 40; i++) {',
  '    float h = scene(ro + rd * t);',
  '    res = min(res, 10.0 * h / t);',
  '    t += clamp(h, 0.02, 0.2);',
  '    if (res < 0.001 || t > 4.0) break;',
  '  }',
  '  return clamp(res, 0.0, 1.0);',
  '}',
  'float ao(vec3 p, vec3 n){',
  '  float o = 0.0, s = 1.0;',
  '  for (int i = 1; i <= 5; i++) { float h = 0.03 * float(i); o += (h - scene(p + n * h)) * s; s *= 0.7; }',
  '  return clamp(1.0 - 2.5 * o, 0.0, 1.0);',
  '}',
  'void main(){',
  '  vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;',
  '  uv.x -= 0.32 * min(1.0, uRes.x / uRes.y - 0.9);',
  '  ANG = uTime * 0.45 + (uPointer.x - 0.5) * 2.0;',
  '  vec3 ro = vec3(0.0, 0.9, 5.2), ta = vec3(0.0, -0.1, 0.0);',
  '  vec3 f = normalize(ta - ro), r = normalize(cross(f, vec3(0.0, 1.0, 0.0))), u = cross(r, f);',
  '  vec3 rd = normalize(uv.x * r + uv.y * u + 1.6 * f);',
  '  vec3 bg = mix(vec3(0.85, 0.79, 0.72), vec3(0.94, 0.90, 0.85), smoothstep(-0.5, 0.6, uv.y));',
  '  float t = 0.0, d = 0.0; bool hit = false;',
  '  for (int i = 0; i < STEPS; i++) {',
  '    vec3 p = ro + rd * t;',
  '    d = scene(p);',
  '    if (d < 0.001) { hit = true; break; }',
  '    t += d;',
  '    if (t > 12.0) break;',
  '  }',
  '  vec3 col = bg;',
  '  if (hit) {',
  '    vec3 p = ro + rd * t, n = normal(p);',
  '    vec3 L = normalize(vec3(-0.6, 0.9, 0.7));',
  '    float dif = max(dot(n, L), 0.0) * shadow(p + n * 0.003, L);',
  '    float occ = ao(p, n);',
  '    if (floorD(p) < 0.002) {',
  '      col = bg * (0.55 + 0.45 * dif) * mix(0.55, 1.0, occ);',
  '      col = mix(col, bg, smoothstep(4.0, 9.0, t));',
  '    } else {',
  '      vec3 q = p; q.xz = rot(ANG) * q.xz;',
  '      float a = atan(q.z, q.x);',
  '      float stripes = 0.5 + 0.5 * smoothstep(0.2, 0.8, abs(sin(a * 38.0)));',
  '      vec3 base = q.y > 0.6 ? METAL : FABRIC * mix(0.8, 1.05, stripes);',
  '      float spec = pow(max(dot(reflect(-L, n), -rd), 0.0), q.y > 0.6 ? 40.0 : 8.0) * (q.y > 0.6 ? 0.7 : 0.12);',
  '      float rim = pow(1.0 - max(dot(n, -rd), 0.0), 3.0) * 0.35;',
  '      col = base * (0.28 + 0.85 * dif) * occ + spec + rim * vec3(1.0, 0.95, 0.9);',
  '    }',
  '  }',
  '  col = pow(col, vec3(0.95));',
  '  gl_FragColor = vec4(col, 1.0);',
  '}'
].join('\n'));
</script>
</body>
</html>
