<html lang="en">

<title>Perigee Labs · Starfield warp</title>
<style>
:root{--bg:#03040a;--fg:#eef3ff;--accent:#7fe0d6;--font:'Avenir Next',Avenir,'Helvetica Neue',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);overflow:hidden}
body{font-family:var(--font, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif)}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .8s ease}
html.gl-on #gl{opacity:1}
.fallback{position:fixed;inset:0;overflow:hidden}
html.gl-on .fallback{visibility:hidden;transition:visibility 0s .8s}
.fallback svg{position:absolute;inset:0;width:100%;height:100%}
.gl-note{display:none;position:fixed;right:20px;bottom:18px;z-index:3;font:12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;padding:6px 10px;border-radius:6px;background:rgba(0,0,0,.45);color:#fff}
html.gl-off .gl-note{display:block}
.overlay{position:fixed;z-index:2;pointer-events:none}
.overlay a,.overlay button{pointer-events:auto}
@media (prefers-reduced-motion: reduce){#gl{transition:none}}
.overlay.center{left:50%;top:50%;transform:translate(-50%,-50%);text-align:center}
.kicker{font:500 .78rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.3em;text-transform:uppercase;color:var(--accent)}
.overlay.center{text-shadow:0 2px 18px #03040a}
.count{margin-top:1.2rem;display:flex;gap:clamp(.8rem,2.5vw,2.4rem);justify-content:center;font:300 clamp(2.6rem,7vw,6rem)/1 ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums;text-shadow:0 0 30px rgba(127,224,214,.35)}
.count small{display:block;margin-top:.6rem;font-size:.7rem;letter-spacing:.22em;color:#8d9ab8}
h1{margin-top:1.6rem;font-weight:500;font-size:clamp(1.2rem,2.2vw,1.7rem);letter-spacing:.02em}
.overlay.foot{left:4vw;right:4vw;bottom:4vh;display:flex;justify-content:space-between;font:.75rem ui-monospace,SFMono-Regular,Menlo,monospace;color:#8d9ab8;letter-spacing:.08em}
.overlay.brand{left:4vw;top:4vh;font-weight:600;letter-spacing:.32em;text-transform:uppercase;font-size:.85rem}
</style>
</head>
