<title>Ridgeline · Live topographic contours</title>
<style>
:root{--bg:#f1ebdf;--fg:#22302a;--accent:#c0582c;--font:'Avenir Next',Avenir,'Helvetica Neue',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);overflow:hidden}
body{font-family:var(--font, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif)}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .8s ease}
html.gl-on #gl{opacity:1}
.fallback{position:fixed;inset:0;overflow:hidden}
html.gl-on .fallback{visibility:hidden;transition:visibility 0s .8s}
.fallback svg{position:absolute;inset:0;width:100%;height:100%}
.gl-note{display:none;position:fixed;right:20px;bottom:18px;z-index:3;font:12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;padding:6px 10px;border-radius:6px;background:rgba(0,0,0,.45);color:#fff}
html.gl-off .gl-note{display:block}
.overlay{position:fixed;z-index:2;pointer-events:none}
.overlay a,.overlay button{pointer-events:auto}
@media (prefers-reduced-motion: reduce){#gl{transition:none}}
.overlay.card{left:5vw;top:9vh;max-width:30rem;padding:1.8rem 2rem;background:rgba(241,235,223,.92);border:1px solid #33443a}
.kicker{font:500 .74rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
h1{margin-top:.9rem;font-family:Charter,'Iowan Old Style',Georgia,serif;font-weight:700;font-size:clamp(2.2rem,4.8vw,4.2rem);line-height:1.02;letter-spacing:-.01em}
.sub{margin-top:1rem;line-height:1.55;color:#3d4b43}
.cta{display:inline-block;margin-top:1.4rem;padding:.75rem 1.3rem;background:#22302a;color:#f1ebdf;text-decoration:none;font-size:.92rem}
.label{position:fixed;z-index:2;font:500 .72rem/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;color:#22302a;letter-spacing:.06em;pointer-events:none}
.label::before{content:"▲ ";color:var(--accent)}
.scale{position:fixed;z-index:2;right:5vw;bottom:5vh;font:.72rem ui-monospace,SFMono-Regular,Menlo,monospace;color:#22302a}
.scale i{display:block;width:8rem;height:.4rem;margin-bottom:.4rem;border:1px solid #22302a;background:linear-gradient(90deg,#22302a 0 25%,transparent 25% 50%,#22302a 50% 75%,transparent 75%)}
</style>
