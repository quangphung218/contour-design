<!doctype html>

<style>
/* Explainer: how it works: a 14 s, 1920x1080 HyperFrames composition.
   Every movement is a CSS animation that spans the whole film (--film) and
   loops; keyframe percentages are fractions of the 14 s film
   (1 s = 7.1429%). The master timeline below pins every
   animation to the renderer's time. Sizes are in cqw (1cqw = 19.2px
   on the 1920px grid), so the stage scales to any preview. System fonts
   and inline SVG only: nothing is downloaded. */
html, body { margin: 0; height: 100%; background: #eef3ff; overflow: hidden; }
body { display: grid; place-items: center; }
#stage {
  --film: 14s;
  position: relative; overflow: hidden; container-type: size;
  width: min(100vw, calc(100vh * 1920 / 1080)); aspect-ratio: 1920 / 1080;
  background: #eef3ff; color: #14213d; font-family: ui-sans-serif, -apple-system, "Helvetica Neue", "Segoe UI", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
#stage * { box-sizing: border-box; }

.title { position: absolute; left: 0; right: 0; top: 6.25cqw; text-align: center; font-size: 4.375cqw; font-weight: 800; letter-spacing: -0.1042cqw; }
.title em { font-style: normal; color: #3d5afe; }
.track { position: absolute; left: 18.75cqw; top: 25.7292cqw; width: 62.5cqw; height: 0.625cqw; border-radius: 0.3125cqw; background: #d5ddf3; }
.fill { position: absolute; left: 18.75cqw; top: 25.7292cqw; width: 62.5cqw; height: 0.625cqw; border-radius: 0.3125cqw; background: #ff8a3d; transform-origin: 0 50%; }
.dot { position: absolute; left: 17.1875cqw; top: 24.4792cqw; width: 3.125cqw; height: 3.125cqw; border-radius: 50%; background: #ff8a3d; box-shadow: 0 0 0 0.7292cqw rgba(255,138,61,.22); }
.node { position: absolute; top: 19.7917cqw; width: 12.5cqw; height: 12.5cqw; margin-left: -6.25cqw; border-radius: 50%; background: #fff; box-shadow: 0 1.25cqw 2.6042cqw rgba(20,33,61,.12); display: grid; place-items: center; }
.node svg { width: 6.7708cqw; height: 6.7708cqw; }
.node svg * { fill: none; stroke: #14213d; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
.node svg .hi { stroke: #3d5afe; }
.cap { position: absolute; top: 35.4167cqw; width: 22.9167cqw; margin-left: -11.4583cqw; text-align: center; }
.cap b { display: block; font: 700 1.25cqw/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 0.3125cqw; color: #ff8a3d; margin-bottom: 0.9375cqw; }
.cap strong { display: block; font-size: 2.7083cqw; font-weight: 800; letter-spacing: -0.0521cqw; margin-bottom: 0.7292cqw; }
.cap span { font-size: 1.5625cqw; line-height: 1.3; color: #5c6b8a; }
.outro { position: absolute; left: 0; right: 0; top: 49.4792cqw; text-align: center; font-size: 2.9167cqw; font-weight: 800; color: #3d5afe; }

@keyframes k1 {
  0% { opacity: 0; transform: translateY(-1.5625cqw); animation-timing-function: linear; }
  2.1429% { opacity: 0; transform: translateY(-1.5625cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  7.1429% { opacity: 1; transform: none; animation-timing-function: linear; }
  74.2857% { opacity: 1; transform: none; animation-timing-function: cubic-bezier(.55,0,1,.45); }
  77.1429% { opacity: 0; transform: translateY(-1.5625cqw); animation-timing-function: linear; }
  100% { opacity: 0; transform: translateY(-1.5625cqw); animation-timing-function: linear; }
}
@keyframes k2 {
  0% { opacity: 0; transform: scaleX(0); animation-timing-function: linear; }
  6.4286% { opacity: 0; transform: scaleX(0); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  12.1429% { opacity: 1; transform: none; animation-timing-function: linear; }
  92.1429% { opacity: 1; transform: none; animation-timing-function: cubic-bezier(.55,0,1,.45); }
  95% { opacity: 0; transform: none; animation-timing-function: linear; }
  100% { opacity: 0; transform: none; animation-timing-function: linear; }
}
@keyframes k3 {
  0% { transform: scaleX(0); opacity: 1; animation-timing-function: linear; }
  25.7143% { transform: scaleX(0); opacity: 1; animation-timing-function: cubic-bezier(.4,0,.2,1); }
  35.7143% { transform: scaleX(0.5); opacity: 1; animation-timing-function: linear; }
  50% { transform: scaleX(0.5); opacity: 1; animation-timing-function: cubic-bezier(.4,0,.2,1); }
  60% { transform: scaleX(1); opacity: 1; animation-timing-function: linear; }
  92.1429% { transform: scaleX(1); opacity: 1; animation-timing-function: cubic-bezier(.55,0,1,.45); }
  95.7143% { transform: scaleX(1); opacity: 0; animation-timing-function: linear; }
  100% { transform: scaleX(1); opacity: 0; animation-timing-function: linear; }
}

  25.7143% { opacity: 1; transform: none; animation-timing-function: cubic-bezier(.4,0,.2,1); }
  35.7143% { opacity: 1; transform: translateX(31.25cqw); animation-timing-function: linear; }
  50% { opacity: 1; transform: translateX(31.25cqw); animation-timing-function: cubic-bezier(.4,0,.2,1); }
  60% { opacity: 1; transform: translateX(62.5cqw); animation-timing-function: linear; }
  92.1429% { opacity: 1; transform: translateX(62.5cqw); animation-timing-function: cubic-bezier(.55,0,1,.45); }
  95.7143% { opacity: 0; transform: translateX(62.5cqw) scale(.2); animation-timing-function: linear; }
  100% { opacity: 0; transform: translateX(62.5cqw) scale(.2); animation-timing-function: linear; }
}

  11.4286% { opacity: 0; transform: scale(.4); animation-timing-function: cubic-bezier(.34,1.56,.64,1); }
  15% { opacity: 1; transform: none; animation-timing-function: linear; }
  92.1429% { opacity: 1; transform: none; animation-timing-function: cubic-bezier(.55,0,1,.45); }
  95% { opacity: 0; transform: scale(.8); animation-timing-function: linear; }
  100% { opacity: 0; transform: scale(.8); animation-timing-function: linear; }

  14.2857% { opacity: 0; transform: translateY(1.5625cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }

  92.1429% { opacity: 1; transform: none; animation-timing-function: cubic-bezier(.55,0,1,.45); }
  95% { opacity: 0; transform: none; animation-timing-function: linear; }
  100% { opacity: 0; transform: none; animation-timing-function: linear; }
}
@keyframes k7 {

  35.7143% { opacity: 0; transform: scale(.4); animation-timing-function: cubic-bezier(.34,1.56,.64,1); }
  39.2857% { opacity: 1; transform: none; animation-timing-function: linear; }
  92.1429% { opacity: 1; transform: none; animation-timing-function: cubic-bezier(.55,0,1,.45); }
  95% { opacity: 0; transform: scale(.8); animation-timing-function: linear; }

  43.5714% { opacity: 1; transform: none; animation-timing-function: linear; }
  92.1429% { opacity: 1; transform: none; animation-timing-function: cubic-bezier(.55,0,1,.45); }

  100% { opacity: 0; transform: none; animation-timing-function: linear; }
}
@keyframes k9 {

  60% { opacity: 0; transform: scale(.4); animation-timing-function: cubic-bezier(.34,1.56,.64,1); }
  63.5714% { opacity: 1; transform: none; animation-timing-function: linear; }
  92.1429% { opacity: 1; transform: none; animation-timing-function: cubic-bezier(.55,0,1,.45); }
  95% { opacity: 0; transform: scale(.8); animation-timing-function: linear; }
  100% { opacity: 0; transform: scale(.8); animation-timing-function: linear; }
}
@keyframes k10 {

  62.8571% { opacity: 0; transform: translateY(1.5625cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  67.8571% { opacity: 1; transform: none; animation-timing-function: linear; }

  77.1429% { opacity: 0; transform: translateY(1.5625cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  82.1429% { opacity: 1; transform: none; animation-timing-function: linear; }

  100% { opacity: 0; transform: none; animation-timing-function: linear; }
}
#title { animation: k1 var(--film) linear infinite both; }
#track { animation: k2 var(--film) linear infinite both; }
#fill { animation: k3 var(--film) linear infinite both; }
#dot { animation: k4 var(--film) linear infinite both; }

<script>
// Master timeline. The renderer pauses it and calls seek(t) for every frame;
// seek pins each CSS animation of the film to t, so the film is the same on
// every render. Without scripts (the gallery preview) the CSS loops alone.
(() => {
  const DURATION = 14;
  const all = () => (document.getAnimations ? document.getAnimations() : []);
  const timeline = {
    duration: () => DURATION,
    pause() { all().forEach((a) => a.pause()); return timeline; },
    play() { all().forEach((a) => a.play()); return timeline; },
    seek(t) {
      const ms = Math.min(Math.max(Number(t) || 0, 0), DURATION) * 1000;
      all().forEach((a) => { a.pause(); a.currentTime = ms; });
      return timeline;
    },
  };
  window.__timelines = window.__timelines || {};
  window.__timelines.main = timeline;
})();
</script>
