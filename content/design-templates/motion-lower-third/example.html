<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lower third</title>
<meta name="od-motion-output" content="video">
<meta name="od-motion-audio" content="silent">
<style>
/* Lower third: a 6 s, 1920x1080 HyperFrames composition.
   Every movement is a CSS animation that spans the whole film (--film) and
   loops; keyframe percentages are fractions of the 6 s film
   (1 s = 16.667%). The master timeline below pins every
   animation to the renderer's time. Sizes are in cqw (1cqw = 19.2px
   on the 1920px grid), so the stage scales to any preview. System fonts
   and inline SVG only: nothing is downloaded. */
@property --n { syntax: '<integer>'; inherits: false; initial-value: 0; }
html, body { margin: 0; height: 100%; background: #23303a; overflow: hidden; }
body { display: grid; place-items: center; }
#stage {
  --film: 6s;
  position: relative; overflow: hidden; container-type: size;
  width: min(100vw, calc(100vh * 1920 / 1080)); aspect-ratio: 1920 / 1080;
  background: #23303a; color: #ffffff; font-family: ui-sans-serif, -apple-system, "Helvetica Neue", "Segoe UI", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
#stage * { box-sizing: border-box; }

.bg { position: absolute; inset: -10%; background:
  radial-gradient(40% 50% at 30% 40%, #5b7f8f 0%, rgba(91,127,143,0) 70%),
  radial-gradient(35% 45% at 72% 58%, #8f6f5b 0%, rgba(143,111,91,0) 70%),
  radial-gradient(60% 60% at 50% 100%, #1a242c 0%, rgba(26,36,44,0) 80%), #23303a; filter: blur(1.5625cqw); }
.vig { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.45) 100%); }
.strap { position: absolute; left: 7.2917cqw; bottom: 7.8125cqw; display: flex; align-items: stretch; height: 8.8542cqw; }
.block { width: 1.1458cqw; background: #c8f169; transform-origin: bottom; }
.panel { position: relative; overflow: hidden; background: rgba(12,16,20,.82); padding: 1.3542cqw 2.5cqw 1.3542cqw 2.0833cqw; display: flex; flex-direction: column; justify-content: center; gap: 0.5208cqw; transform-origin: left; }
.name { font-size: 3.3333cqw; font-weight: 800; letter-spacing: -0.0521cqw; line-height: 1; }
.role { font-size: 1.5625cqw; color: #c8f169; font-weight: 600; letter-spacing: 0.0521cqw; }
.live { position: absolute; left: 7.2917cqw; top: 5.7292cqw; display: flex; align-items: center; gap: 0.7292cqw; font: 700 1.25cqw/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 0.2083cqw; }
.dot { width: 0.9375cqw; height: 0.9375cqw; border-radius: 50%; background: #ff4d4d; }

@keyframes k1 {
  0% { transform: scale(1.08) translateX(-1.0417cqw); animation-timing-function: linear; }
  100% { transform: scale(1.0) translateX(1.0417cqw); animation-timing-function: linear; }
}
@keyframes k2 {
  0% { opacity: 0; transform: translateY(-1.0417cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  3.333% { opacity: 0; transform: translateY(-1.0417cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  11.667% { opacity: 1; transform: none; animation-timing-function: cubic-bezier(.22,1,.36,1); }
  86.667% { opacity: 1; transform: none; animation-timing-function: cubic-bezier(.55,0,1,.45); }
  93.333% { opacity: 0; transform: none; animation-timing-function: linear; }
  100% { opacity: 0; transform: none; animation-timing-function: linear; }
}
@keyframes k3 {
  0% { opacity: 1; animation-timing-function: cubic-bezier(.65,0,.35,1); }
  3.333% { opacity: 1; animation-timing-function: cubic-bezier(.65,0,.35,1); }
  16.667% { opacity: .25; animation-timing-function: cubic-bezier(.65,0,.35,1); }
  30% { opacity: 1; animation-timing-function: cubic-bezier(.65,0,.35,1); }
  43.333% { opacity: .25; animation-timing-function: cubic-bezier(.65,0,.35,1); }
  56.667% { opacity: 1; animation-timing-function: cubic-bezier(.65,0,.35,1); }
  70% { opacity: .25; animation-timing-function: cubic-bezier(.65,0,.35,1); }
  83.333% { opacity: 1; animation-timing-function: linear; }
  100% { opacity: 1; animation-timing-function: linear; }
}
@keyframes k4 {
  0% { transform: scaleY(0); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  10% { transform: scaleY(0); animation-timing-function: cubic-bezier(.16,1,.3,1); }
  16.667% { transform: none; animation-timing-function: cubic-bezier(.22,1,.36,1); }
  86.667% { transform: none; animation-timing-function: cubic-bezier(.55,0,1,.45); }
  92.5% { transform: scaleY(0); animation-timing-function: linear; }
  100% { transform: scaleY(0); animation-timing-function: linear; }
}
@keyframes k5 {
  0% { transform: scaleX(0); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  15% { transform: scaleX(0); animation-timing-function: cubic-bezier(.16,1,.3,1); }
  25% { transform: none; animation-timing-function: cubic-bezier(.22,1,.36,1); }
  80% { transform: none; animation-timing-function: cubic-bezier(.65,0,.35,1); }
  87.5% { transform: scaleX(0); animation-timing-function: linear; }
  100% { transform: scaleX(0); animation-timing-function: linear; }
}
@keyframes k6 {
  0% { transform: translateX(-3.125cqw); opacity: 0; animation-timing-function: cubic-bezier(.22,1,.36,1); }
  20% { transform: translateX(-3.125cqw); opacity: 0; animation-timing-function: cubic-bezier(.22,1,.36,1); }
  30% { transform: none; opacity: 1; animation-timing-function: cubic-bezier(.22,1,.36,1); }
  76.667% { transform: none; opacity: 1; animation-timing-function: cubic-bezier(.55,0,1,.45); }
  81.667% { transform: none; opacity: 0; animation-timing-function: linear; }
  100% { transform: none; opacity: 0; animation-timing-function: linear; }
}
@keyframes k7 {
  0% { transform: translateX(-2.0833cqw); opacity: 0; animation-timing-function: cubic-bezier(.22,1,.36,1); }
  23.333% { transform: translateX(-2.0833cqw); opacity: 0; animation-timing-function: cubic-bezier(.4,0,.2,1); }
  33.333% { transform: none; opacity: 1; animation-timing-function: cubic-bezier(.22,1,.36,1); }
  76.667% { transform: none; opacity: 1; animation-timing-function: cubic-bezier(.55,0,1,.45); }
  81.667% { transform: none; opacity: 0; animation-timing-function: linear; }
  100% { transform: none; opacity: 0; animation-timing-function: linear; }
}
#bg { animation: k1 var(--film) linear infinite both; }
#live { animation: k2 var(--film) linear infinite both; }
#dot { animation: k3 var(--film) linear infinite both; }
#block { animation: k4 var(--film) linear infinite both; }
#panel { animation: k5 var(--film) linear infinite both; }
#name { animation: k6 var(--film) linear infinite both; }
#role { animation: k7 var(--film) linear infinite both; }
</style>
</head>
<body>
<div id="stage" data-composition-id="main" data-start="0" data-duration="6"
  data-width="1920" data-height="1080" data-fps="30" data-poster-time="3">
<div class="bg" id="bg"></div><div class="vig"></div>
<div class="live" id="live"><span class="dot" id="dot"></span>INTERVIEW</div>
<div class="strap">
  <div class="block" id="block"></div>
  <div class="panel" id="panel">
    <div class="name" id="name">Mai Tran</div>
    <div class="role" id="role">Head of Product, Fieldnote</div>
  </div>
</div>
</div>
<script>
// Master timeline. The renderer pauses it and calls seek(t) for every frame;
// seek pins each CSS animation of the film to t, so the film is the same on
// every render. Without scripts (the gallery preview) the CSS loops alone.
(() => {
  const DURATION = 6;
  const all = () => (document.getAnimations ? document.getAnimations() : []);
  const timeline = {
    duration: () => DURATION,
    pause() { all().forEach((a) => a.pause()); return timeline; },
    play() { all().forEach((a) => a.play()); return timeline; },
    seek(t) {
      const ms = Math.min(Math.max(Number(t) || 0, 0), DURATION) * 1000;
      all().forEach((a) => { a.pause(); a.currentTime = ms; });
      return timeline;
    },
  };
  window.__timelines = window.__timelines || {};
  window.__timelines.main = timeline;
})();
</script>
</body>
</html>
