:root{--bg:#07111f;--fg:#e8f4f2;--accent:#ffb547;--font:'Avenir Next',Avenir,'Helvetica Neue',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);overflow:hidden}
body{font-family:var(--font, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif)}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .8s ease}
html.gl-on #gl{opacity:1}
.fallback{position:fixed;inset:0;overflow:hidden}
html.gl-on .fallback{visibility:hidden;transition:visibility 0s .8s}
.fallback svg{position:absolute;inset:0;width:100%;height:100%}
.gl-note{display:none;position:fixed;right:20px;bottom:18px;z-index:3;font:12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;padding:6px 10px;border-radius:6px;background:rgba(0,0,0,.45);color:#fff}
html.gl-off .gl-note{display:block}
.overlay{position:fixed;z-index:2;pointer-events:none}
.overlay a,.overlay button{pointer-events:auto}
@media (prefers-reduced-motion: reduce){#gl{transition:none}}
.overlay.left{left:6vw;top:50%;transform:translateY(-50%);max-width:26rem}
.kicker{display:flex;align-items:center;gap:.6rem;font:500 .78rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:#6fd3c1}
.kicker i{width:.5rem;height:.5rem;border-radius:50%;background:#6fd3c1;box-shadow:0 0 0 4px rgba(111,211,193,.2)}
h1{margin-top:1.1rem;font-weight:600;font-size:clamp(2.2rem,4.6vw,4rem);line-height:1.02;letter-spacing:-.02em}
.stats{margin-top:2.2rem;display:grid;gap:1.1rem}
.stat{border-left:2px solid #ffb547;padding-left:1rem}
.stat b{display:block;font:600 2rem/1.1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#fff}
.stat span{font-size:.88rem;color:#9fb8b4}
.overlay.legend{right:4vw;bottom:5vh;display:flex;gap:1.4rem;font:.75rem ui-monospace,SFMono-Regular,Menlo,monospace;color:#9fb8b4}
.legend i{display:inline-block;width:.9rem;height:2px;background:#ffb547;vertical-align:middle;margin-right:.4rem}
.legend i.dot{width:.5rem;height:.5rem;border-radius:50%;background:#6fd3c1}
</style>

  'void main(){',
  '  vec3 p = aPos;',
  '  float c = cos(uRot), s = sin(uRot);',
  '  p = vec3(c * p.x + s * p.z, p.y, -s * p.x + c * p.z);',
  '  float ct = cos(uTilt), st = sin(uTilt);',
  '  p = vec3(p.x, ct * p.y - st * p.z, st * p.y + ct * p.z);',
  '  vFace = p.z / length(p);',
  '  vKind = aKind;',
  '  vT = aT;',
  '  vec4 clip = uProj * vec4(p.x, p.y, p.z - 4.2, 1.0);',
  '  clip.x += 0.42 * clip.w * clamp((uRes.x / uRes.y - 1.0), 0.0, 1.0);',
  '  gl_Position = clip;',
  '  gl_PointSize = (1.4 + 1.8 * max(vFace, 0.0)) * clamp(uRes.y / 800.0, 1.0, 2.0);',
  '}'
].join('\n'), [
  'precision mediump float;',
  'uniform float uTime;',
  'varying float vFace;',
  'varying float vKind;',
  'varying float vT;',
  'void main(){',
  '  if (vKind < 0.5) {',
  '    vec2 c = gl_PointCoord - 0.5;',
  '    if (length(c) > 0.5) discard;',
  '    float a = mix(0.08, 0.95, smoothstep(-0.3, 0.6, vFace)) * mix(0.22, 1.0, vT);',
  '    gl_FragColor = vec4(vec3(0.44, 0.83, 0.76) * a, 1.0);',
  '  } else {',
  '    float head = fract(uTime * 0.35 + vKind * 0.173);',
  '    float trail = smoothstep(head - 0.45, head, vT) * step(vT, head);',
  '    float a = (0.3 + 0.7 * trail) * smoothstep(-0.45, 0.1, vFace);',
  '    gl_FragColor = vec4(vec3(1.0, 0.71, 0.28) * a, 1.0);',
  '  }',
  '}'
].join('\n'));
  if (!p) return null;
  var data = [];
  var N = 14000, ga = Math.PI * (3 - Math.sqrt(5)), dots = 0;
  for (var i = 0; i < N; i++) {
    var y = 1 - 2 * (i + 0.5) / N, r = Math.sqrt(1 - y * y);
    var x = Math.cos(ga * i) * r, z = Math.sin(ga * i) * r;
    data.push(x, y, z, 0, land(x, y, z) ? 1 : 0); dots++;
  }
  var strips = [], SEG = 64;
  ROUTES.forEach(function (rt, k) {
    var a = HUBS[rt[0]], b = HUBS[rt[1]];
    var dot = a[0] * b[0] + a[1] * b[1] + a[2] * b[2], om = Math.acos(Math.min(1, Math.max(-1, dot)));
    var start = data.length / 5;
    for (var j = 0; j <= SEG; j++) {
      var t = j / SEG, s0 = Math.sin((1 - t) * om) / Math.sin(om), s1 = Math.sin(t * om) / Math.sin(om);
      var lift = 1 + 0.18 * om * Math.sin(Math.PI * t);
      data.push((a[0] * s0 + b[0] * s1) * lift, (a[1] * s0 + b[1] * s1) * lift, (a[2] * s0 + b[2] * s1) * lift, 1 + k, t);
    }
    strips.push(start);
  });
  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(data), gl.STATIC_DRAW);
  var aPos = gl.getAttribLocation(p, 'aPos'), aKind = gl.getAttribLocation(p, 'aKind'), aT = gl.getAttribLocation(p, 'aT');
  var u = {};
  ['uProj', 'uRot', 'uTilt', 'uTime', 'uRes'].forEach(function (n) { u[n] = gl.getUniformLocation(p, n); });
  return function (t, res, ptr) {
    gl.clearColor(0.027, 0.067, 0.12, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.useProgram(p);
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.enableVertexAttribArray(aPos); gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 20, 0);
    gl.enableVertexAttribArray(aKind); gl.vertexAttribPointer(aKind, 1, gl.FLOAT, false, 20, 12);
    gl.enableVertexAttribArray(aT); gl.vertexAttribPointer(aT, 1, gl.FLOAT, false, 20, 16);
    gl.uniformMatrix4fv(u.uProj, false, GLX.perspective(0.75, res[0] / res[1], 0.1, 20));
    gl.uniform1f(u.uRot, -0.8 + 0.7 * Math.sin(t * 0.07) + (ptr[0] - 0.5) * 1.2);
    gl.uniform1f(u.uTilt, 0.32 + (ptr[1] - 0.5) * 0.3);
    gl.uniform1f(u.uTime, t);
    gl.uniform2f(u.uRes, res[0], res[1]);
    gl.drawArrays(gl.POINTS, 0, dots);
    strips.forEach(function (s) { gl.drawArrays(gl.LINE_STRIP, s, SEG + 1); });
  };
});
</script>
