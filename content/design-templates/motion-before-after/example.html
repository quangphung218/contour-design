<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Before and after</title>
<meta name="od-motion-output" content="video">
<meta name="od-motion-audio" content="silent">
<style>
/* Before and after: a 10 s, 1920x1080 HyperFrames composition.
   Every movement is a CSS animation that spans the whole film (--film) and
   loops; keyframe percentages are fractions of the 10 s film
   (1 s = 10%). The master timeline below pins every
   animation to the renderer's time. Sizes are in cqw (1cqw = 19.2px
   on the 1920px grid), so the stage scales to any preview. System fonts
   and inline SVG only: nothing is downloaded. */
html, body { margin: 0; height: 100%; background: #f3f0ea; overflow: hidden; }
body { display: grid; place-items: center; }
#stage {
  --film: 10s;
  position: relative; overflow: hidden; container-type: size;
  width: min(100vw, calc(100vh * 1920 / 1080)); aspect-ratio: 1920 / 1080;
  background: #f3f0ea; color: #1d1d1f; font-family: ui-sans-serif, -apple-system, "Helvetica Neue", "Segoe UI", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
#stage * { box-sizing: border-box; }

.title { position: absolute; left: 0; right: 0; top: 3.6458cqw; text-align: center; font-size: 3.75cqw; font-weight: 800; letter-spacing: -0.1042cqw; }
.title em { font-style: normal; color: #5b4bff; }
.frame { position: absolute; left: 16.6667cqw; top: 10.9375cqw; width: 66.6667cqw; height: 32.2917cqw; border-radius: 1.3542cqw; overflow: hidden; box-shadow: 0 1.5625cqw 3.6458cqw rgba(29,29,31,.16); }
.pane { position: absolute; inset: 0; padding: 3.125cqw 4.6875cqw; }
.before { background: #e4dfd6; }
.after { background: #ffffff; }
.mess { position: absolute; height: 1.7708cqw; border-radius: 0.3125cqw; background: #c7c0b3; }
.mess.r { background: #c9573a; width: 0.9375cqw; height: 0.9375cqw; border-radius: 50%; }
.field { height: 3.9583cqw; border-radius: 0.7292cqw; border: 0.1562cqw solid #dcd8f5; margin-bottom: 1.3542cqw; padding: 0 1.3542cqw; display: flex; align-items: center; font-size: 1.4583cqw; color: #77736b; }
.field b { color: #1d1d1f; font-weight: 600; margin-right: 0.9375cqw; }
.btn { width: 16.6667cqw; height: 4.1667cqw; border-radius: 2.0833cqw; background: #5b4bff; color: #fff; display: grid; place-items: center; font-size: 1.5625cqw; font-weight: 700; margin-top: 2.0833cqw; }
.label { position: absolute; top: 1.4583cqw; padding: 0.5208cqw 1.1458cqw; border-radius: 1.5625cqw; font: 700 1.1458cqw/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 0.2083cqw; }
.lb { left: 1.4583cqw; background: #1d1d1f; color: #f3f0ea; }
.la { right: 1.4583cqw; background: #5b4bff; color: #fff; }
.handle { position: absolute; top: 10.9375cqw; width: 0; height: 32.2917cqw; left: 83.3333cqw; }
.handle::before { content: ""; position: absolute; left: -0.1562cqw; top: 0; bottom: 0; width: 0.3125cqw; background: #1d1d1f; }
.knob { position: absolute; left: -2.2917cqw; top: 13.8542cqw; width: 4.5833cqw; height: 4.5833cqw; border-radius: 50%; background: #1d1d1f; display: grid; place-items: center; }
.knob svg { width: 2.7083cqw; height: 2.7083cqw; }
.stats { position: absolute; left: 0; right: 0; top: 45.8333cqw; display: flex; justify-content: center; gap: 2.0833cqw; }
.stat { padding: 1.25cqw 2.0833cqw; border-radius: 1.1458cqw; background: #fff; font-size: 1.7708cqw; color: #77736b; box-shadow: 0 0.625cqw 1.5625cqw rgba(29,29,31,.08); }
.stat s { color: #c9573a; }
.stat b { color: #5b4bff; font-weight: 800; }

@keyframes k1 {
  0% { opacity: 0; transform: translateY(-1.5625cqw); animation-timing-function: linear; }
  3% { opacity: 0; transform: translateY(-1.5625cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  10% { opacity: 1; transform: none; animation-timing-function: linear; }
  92% { opacity: 1; transform: none; animation-timing-function: cubic-bezier(.55,0,1,.45); }
  96% { opacity: 0; transform: translateY(-1.5625cqw); animation-timing-function: linear; }
  100% { opacity: 0; transform: translateY(-1.5625cqw); animation-timing-function: linear; }
}
@keyframes k2 {
  0% { opacity: 0; transform: translateY(2.0833cqw) scale(.97); animation-timing-function: linear; }
  6% { opacity: 0; transform: translateY(2.0833cqw) scale(.97); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  14% { opacity: 1; transform: none; animation-timing-function: linear; }
  93% { opacity: 1; transform: none; animation-timing-function: cubic-bezier(.55,0,1,.45); }
  97% { opacity: 0; transform: translateY(2.0833cqw) scale(.97); animation-timing-function: linear; }
  100% { opacity: 0; transform: translateY(2.0833cqw) scale(.97); animation-timing-function: linear; }
}
@keyframes k3 {
  0% { clip-path: inset(0 0 0 100%); animation-timing-function: linear; }
  20% { clip-path: inset(0 0 0 100%); animation-timing-function: cubic-bezier(.4,0,.2,1); }
  34% { clip-path: inset(0 0 0 50%); animation-timing-function: linear; }
  46% { clip-path: inset(0 0 0 50%); animation-timing-function: cubic-bezier(.4,0,.2,1); }
  58% { clip-path: inset(0 0 0 0%); animation-timing-function: linear; }
  100% { clip-path: inset(0 0 0 0%); animation-timing-function: linear; }
}
@keyframes k4 {
  0% { left: 83.3333cqw; opacity: 0; animation-timing-function: linear; }
  16% { left: 83.3333cqw; opacity: 0; animation-timing-function: cubic-bezier(.22,1,.36,1); }
  20% { left: 83.3333cqw; opacity: 1; animation-timing-function: cubic-bezier(.4,0,.2,1); }
  34% { left: 50cqw; opacity: 1; animation-timing-function: linear; }
  46% { left: 50cqw; opacity: 1; animation-timing-function: cubic-bezier(.4,0,.2,1); }
  58% { left: 16.6667cqw; opacity: 1; animation-timing-function: linear; }
  60% { left: 16.6667cqw; opacity: 1; animation-timing-function: cubic-bezier(.22,1,.36,1); }
  64% { left: 16.6667cqw; opacity: 0; animation-timing-function: linear; }
  100% { left: 16.6667cqw; opacity: 0; animation-timing-function: linear; }
}
@keyframes k5 {
  0% { opacity: 0; transform: translateY(1.5625cqw); animation-timing-function: linear; }
  64% { opacity: 0; transform: translateY(1.5625cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  71% { opacity: 1; transform: none; animation-timing-function: linear; }
  92% { opacity: 1; transform: none; animation-timing-function: cubic-bezier(.55,0,1,.45); }
  96% { opacity: 0; transform: translateY(1.5625cqw); animation-timing-function: linear; }
  100% { opacity: 0; transform: translateY(1.5625cqw); animation-timing-function: linear; }
}
@keyframes k6 {
  0% { opacity: 0; transform: translateY(1.5625cqw); animation-timing-function: linear; }
  68% { opacity: 0; transform: translateY(1.5625cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  75% { opacity: 1; transform: none; animation-timing-function: linear; }
  93% { opacity: 1; transform: none; animation-timing-function: cubic-bezier(.55,0,1,.45); }
  97% { opacity: 0; transform: translateY(1.5625cqw); animation-timing-function: linear; }
  100% { opacity: 0; transform: translateY(1.5625cqw); animation-timing-function: linear; }
}
#title { animation: k1 var(--film) linear infinite both; }
#frame { animation: k2 var(--film) linear infinite both; }
#after { animation: k3 var(--film) linear infinite both; }
#handle { animation: k4 var(--film) linear infinite both; }
#s1 { animation: k5 var(--film) linear infinite both; }
#s2 { animation: k6 var(--film) linear infinite both; }
</style>
</head>
<body>
<div id="stage" data-composition-id="main" data-start="0" data-duration="10"
  data-width="1920" data-height="1080" data-fps="30" data-poster-time="4">
<div class="title" id="title">Same form. <em>Half the clicks.</em></div>
<div class="frame" id="frame">

  <div class="stat" id="s1">Fields <s>14</s> → <b>3</b></div>

</div>
</div>
<script>
// Master timeline. The renderer pauses it and calls seek(t) for every frame;
// seek pins each CSS animation of the film to t, so the film is the same on
// every render. Without scripts (the gallery preview) the CSS loops alone.
(() => {
  const DURATION = 10;
  const all = () => (document.getAnimations ? document.getAnimations() : []);
  const timeline = {
    duration: () => DURATION,
    pause() { all().forEach((a) => a.pause()); return timeline; },
    play() { all().forEach((a) => a.play()); return timeline; },
    seek(t) {
      const ms = Math.min(Math.max(Number(t) || 0, 0), DURATION) * 1000;
      all().forEach((a) => { a.pause(); a.currentTime = ms; });
      return timeline;
    },
  };
  window.__timelines = window.__timelines || {};
  window.__timelines.main = timeline;
})();
</script>
