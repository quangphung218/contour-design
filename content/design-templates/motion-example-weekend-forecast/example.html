<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Example: weekend weather forecast</title>
<meta name="od-motion-output" content="video">
<meta name="od-motion-audio" content="silent">
<style>
/* Example: weekend weather forecast: a 8 s, 1080x1080 HyperFrames composition.
   Every movement is a CSS animation that spans the whole film (--film) and
   loops; keyframe percentages are fractions of the 8 s film
   (1 s = 12.500%). The master timeline below pins every
   animation to the renderer's time. Sizes are in cqw (1cqw = 10.8px
   on the 1080px grid), so the stage scales to any preview. System fonts
   and inline SVG only: nothing is downloaded. */
@property --n { syntax: '<integer>'; inherits: false; initial-value: 0; }
html, body { margin: 0; height: 100%; background: #cfe6ff; overflow: hidden; }
body { display: grid; place-items: center; }
#stage {
  --film: 8s;
  position: relative; overflow: hidden; container-type: size;
  width: min(100vw, calc(100vh * 1080 / 1080)); aspect-ratio: 1080 / 1080;
  background: #cfe6ff; color: #10233d; font-family: ui-sans-serif, -apple-system, "Helvetica Neue", "Segoe UI", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
#stage * { box-sizing: border-box; }

.num { counter-reset: n var(--n); font-variant-numeric: tabular-nums; }
.num::before { content: counter(n); }

.sky { position: absolute; inset: 0; background: radial-gradient(circle at 78% 18%, #fff3c9 0%, rgba(255,243,201,0) 40%), #cfe6ff; }
.sun { position: absolute; right: 8.3333cqw; top: 7.4074cqw; width: 24.0741cqw; height: 24.0741cqw; }
.cl { position: absolute; width: 27.7778cqw; height: 11.1111cqw; }
.cl i { position: absolute; border-radius: 50%; background: #fff; }
.wrap { position: absolute; left: 7.4074cqw; right: 7.4074cqw; top: 8.3333cqw; bottom: 7.4074cqw; display: flex; flex-direction: column; gap: 1.2963cqw; }
.city { font: 700 2.5926cqw/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 0.5556cqw; color: #3c5a80; }
.now { font-size: 21.2963cqw; font-weight: 900; letter-spacing: -0.9259cqw; line-height: 1; }
.cond { font-size: 3.8889cqw; font-weight: 600; color: #2a4466; }
.days { margin-top: auto; display: flex; gap: 2.4074cqw; }
.day { flex: 1; background: rgba(255,255,255,.82); border-radius: 2.7778cqw; padding: 2.4074cqw; display: flex; flex-direction: column; align-items: center; gap: 1.1111cqw; }
.day svg { width: 8.8889cqw; height: 8.8889cqw; }
.dn { font: 700 2.4074cqw/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 0.3704cqw; color: #3c5a80; }
.tp { font-size: 4.2593cqw; font-weight: 800; }
.tp small { font-size: 2.963cqw; color: #6a83a3; font-weight: 600; }

@keyframes k1 {
  0% { transform: rotate(0deg); opacity: 0; animation-timing-function: cubic-bezier(.22,1,.36,1); }
  1.25% { transform: rotate(0deg); opacity: 0; animation-timing-function: cubic-bezier(.34,1.56,.64,1); }
  12.5% { transform: rotate(0deg); opacity: 1; animation-timing-function: linear; }
  100% { transform: rotate(90deg); opacity: 1; animation-timing-function: linear; }
}
@keyframes k2 {
  0% { transform: translateX(-18.5185cqw); animation-timing-function: linear; }
  100% { transform: translateX(24.0741cqw); animation-timing-function: linear; }
}
@keyframes k3 {
  0% { transform: translateX(14.8148cqw) scale(.7); animation-timing-function: linear; }
  100% { transform: translateX(-11.1111cqw) scale(.7); animation-timing-function: linear; }
}
@keyframes k4 {
  0% { opacity: 0; transform: translateY(-1.8519cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  3.75% { opacity: 0; transform: translateY(-1.8519cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  11.25% { opacity: 1; transform: none; animation-timing-function: linear; }
  100% { opacity: 1; transform: none; animation-timing-function: linear; }
}
@keyframes k5 {
  0% { opacity: 0; transform: translateY(5.5556cqw); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  6.25% { opacity: 0; transform: translateY(5.5556cqw); animation-timing-function: cubic-bezier(.16,1,.3,1); }
  16.25% { opacity: 1; transform: none; animation-timing-function: linear; }
  100% { opacity: 1; transform: none; animation-timing-function: linear; }
}
@keyframes k6 {
  0% { --n: 12; animation-timing-function: cubic-bezier(.22,1,.36,1); }
  7.5% { --n: 12; animation-timing-function: cubic-bezier(.22,1,.36,1); }
  27.5% { --n: 27; animation-timing-function: linear; }
  100% { --n: 27; animation-timing-function: linear; }
}
@keyframes k7 {
  0% { opacity: 0; animation-timing-function: cubic-bezier(.22,1,.36,1); }
  13.75% { opacity: 0; animation-timing-function: cubic-bezier(.4,0,.2,1); }
  21.25% { opacity: 1; animation-timing-function: linear; }
  100% { opacity: 1; animation-timing-function: linear; }
}
@keyframes k8 {
  0% { opacity: 0; transform: perspective(83.3333cqw) rotateX(-80deg); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  25.625% { opacity: 0; transform: perspective(83.3333cqw) rotateX(-80deg); animation-timing-function: cubic-bezier(.34,1.56,.64,1); }
  34.375% { opacity: 1; transform: none; animation-timing-function: linear; }
  100% { opacity: 1; transform: none; animation-timing-function: linear; }
}
@keyframes k9 {
  0% { opacity: 0; transform: perspective(83.3333cqw) rotateX(-80deg); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  28.75% { opacity: 0; transform: perspective(83.3333cqw) rotateX(-80deg); animation-timing-function: cubic-bezier(.34,1.56,.64,1); }
  37.5% { opacity: 1; transform: none; animation-timing-function: linear; }
  100% { opacity: 1; transform: none; animation-timing-function: linear; }
}
@keyframes k10 {
  0% { opacity: 0; transform: perspective(83.3333cqw) rotateX(-80deg); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  31.875% { opacity: 0; transform: perspective(83.3333cqw) rotateX(-80deg); animation-timing-function: cubic-bezier(.34,1.56,.64,1); }
  40.625% { opacity: 1; transform: none; animation-timing-function: linear; }
  100% { opacity: 1; transform: none; animation-timing-function: linear; }
}
@keyframes k11 {
  0% { opacity: 1; animation-timing-function: cubic-bezier(.22,1,.36,1); }
  92.5% { opacity: 1; animation-timing-function: cubic-bezier(.55,0,1,.45); }
  98.75% { opacity: 0; animation-timing-function: linear; }
  100% { opacity: 0; animation-timing-function: linear; }
}
#sun { animation: k1 var(--film) linear infinite both; }
#cl1 { animation: k2 var(--film) linear infinite both; }
#cl2 { animation: k3 var(--film) linear infinite both; }
#city { animation: k4 var(--film) linear infinite both; }
#now { animation: k5 var(--film) linear infinite both; }
#n { animation: k6 var(--film) linear infinite both; }
#cond { animation: k7 var(--film) linear infinite both; }
#d1 { animation: k8 var(--film) linear infinite both; }
#d2 { animation: k9 var(--film) linear infinite both; }
#d3 { animation: k10 var(--film) linear infinite both; }
.wrap { animation: k11 var(--film) linear infinite both; }
</style>
</head>
<body>
<div id="stage" data-composition-id="main" data-start="0" data-duration="8"
  data-width="1080" data-height="1080" data-fps="30" data-poster-time="4.4">
<div class="sky"></div>
<svg class="sun" id="sun" viewBox="0 0 100 100" aria-hidden="true"><g stroke="#ffb627" stroke-width="5" stroke-linecap="round"><path d="M50 4v12M50 84v12M4 50h12M84 50h12M17 17l9 9M74 74l9 9M17 83l9-9M74 26l9-9"/></g><circle cx="50" cy="50" r="22" fill="#ffb627"/></svg>
<div class="cl" id="cl1" style="left:-3.7037cqw;top:43.5185cqw"><i style="left:0;top:4.6296cqw;width:13.8889cqw;height:6.4815cqw"></i><i style="left:5.5556cqw;top:0.9259cqw;width:11.1111cqw;height:10.1852cqw"></i><i style="left:12.963cqw;top:3.7037cqw;width:13.8889cqw;height:7.4074cqw"></i></div>
<div class="cl" id="cl2" style="left:59.2593cqw;top:26.8519cqw"><i style="left:0;top:4.6296cqw;width:13.8889cqw;height:6.4815cqw"></i><i style="left:5.5556cqw;top:0.9259cqw;width:11.1111cqw;height:10.1852cqw"></i><i style="left:12.963cqw;top:3.7037cqw;width:13.8889cqw;height:7.4074cqw"></i></div>
<div class="wrap">
  <div class="city" id="city">LISBON · WEEKEND</div>
  <div class="now" id="now"><span class="num" id="n"></span>°</div>
  <div class="cond" id="cond">Sunny, light breeze</div>
  <div class="days"><div class="day" id="d1"><div class="dn">SAT</div><svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="12" fill="#ffb627"/><g stroke="#ffb627" stroke-width="4" stroke-linecap="round"><path d="M30 4v6M30 50v6M4 30h6M50 30h6M11 11l4 4M45 45l4 4M11 49l4-4M45 15l4-4"/></g></svg><div class="tp">27° <small>18°</small></div></div><div class="day" id="d2"><div class="dn">SUN</div><svg viewBox="0 0 60 60"><circle cx="22" cy="22" r="9" fill="#ffb627"/><path d="M14 44 a10 10 0 0 1 4-19 a13 13 0 0 1 25 3 a8 8 0 0 1 1 16 Z" fill="#dfe7f2"/></svg><div class="tp">24° <small>17°</small></div></div><div class="day" id="d3"><div class="dn">MON</div><svg viewBox="0 0 60 60"><path d="M12 34 a10 10 0 0 1 4-19 a13 13 0 0 1 25 3 a8 8 0 0 1 1 16 Z" fill="#c3d0e2"/><g stroke="#4f8fe8" stroke-width="4" stroke-linecap="round"><path d="M20 42l-3 8M30 42l-3 8M40 42l-3 8"/></g></svg><div class="tp">19° <small>14°</small></div></div></div>
</div>
</div>
<script>
// Master timeline. The renderer pauses it and calls seek(t) for every frame;
// seek pins each CSS animation of the film to t, so the film is the same on
// every render. Without scripts (the gallery preview) the CSS loops alone.
(() => {
  const DURATION = 8;
  const all = () => (document.getAnimations ? document.getAnimations() : []);
  const timeline = {
    duration: () => DURATION,
    pause() { all().forEach((a) => a.pause()); return timeline; },
    play() { all().forEach((a) => a.play()); return timeline; },
    seek(t) {
      const ms = Math.min(Math.max(Number(t) || 0, 0), DURATION) * 1000;
      all().forEach((a) => { a.pause(); a.currentTime = ms; });
      return timeline;
    },
  };
  window.__timelines = window.__timelines || {};
  window.__timelines.main = timeline;
})();
</script>
</body>
</html>
