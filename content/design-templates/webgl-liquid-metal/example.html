<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mercury Sessions · Liquid chrome</title>
<style>
:root{--bg:#08070b;--fg:#ffffff;--accent:#d7ff3d;--font:'Helvetica Neue',Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);overflow:hidden}
body{font-family:var(--font, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif)}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .8s ease}
html.gl-on #gl{opacity:1}
.fallback{position:fixed;inset:0;overflow:hidden}
html.gl-on .fallback{visibility:hidden;transition:visibility 0s .8s}
.fallback svg{position:absolute;inset:0;width:100%;height:100%}
.gl-note{display:none;position:fixed;right:20px;bottom:18px;z-index:3;font:12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;padding:6px 10px;border-radius:6px;background:rgba(0,0,0,.45);color:#fff}
html.gl-off .gl-note{display:block}
.overlay{position:fixed;z-index:2;pointer-events:none}
.overlay a,.overlay button{pointer-events:auto}
@media (prefers-reduced-motion: reduce){#gl{transition:none}}
.fallback{background:
  radial-gradient(22% 30% at 42% 46%, #f4f4f6 0%, #9a9aa3 35%, #2c2c33 70%, transparent 72%),
  radial-gradient(16% 22% at 60% 54%, #ffffff 0%, #8c8c95 40%, #24242a 72%, transparent 74%),
  radial-gradient(11% 15% at 30% 58%, #e6e6ea 0%, #7c7c86 45%, #1d1d22 74%, transparent 76%),
  radial-gradient(9% 12% at 70% 36%, #ffffff 0%, #9090a0 45%, #1d1d22 74%, transparent 76%),
  radial-gradient(70% 40% at 50% 110%, rgba(255,61,139,.35), transparent 70%),
  #08070b}
.overlay.title{left:0;right:0;top:50%;transform:translateY(-50%);text-align:center}
h1{font-family:Impact,Haettenschweiler,'Arial Narrow Bold','Arial Narrow',sans-serif;font-weight:900;text-transform:uppercase;font-size:clamp(4rem,15vw,14rem);line-height:.82;letter-spacing:.01em;color:#fff;-webkit-text-stroke:1px rgba(0,0,0,.6);mix-blend-mode:difference}
.overlay.top{left:4vw;right:4vw;top:4vh;display:flex;justify-content:space-between;font:600 .8rem/1 'Helvetica Neue',Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase}
.overlay.bottom{left:4vw;right:4vw;bottom:5vh;display:flex;justify-content:space-between;align-items:flex-end}
.date{font-family:Impact,'Arial Narrow',sans-serif;font-size:clamp(1.6rem,3vw,2.6rem);color:var(--accent);text-transform:uppercase}
.acts{font-size:.95rem;line-height:1.6;text-align:right;color:#d8d8de}
.cta{display:inline-block;margin-top:.8rem;padding:.7rem 1.3rem;border:1px solid #fff;color:#fff;text-decoration:none;text-transform:uppercase;letter-spacing:.14em;font-size:.78rem}
</style>
</head>
<body>
<div class="fallback" aria-hidden="true" data-webgl-fallback>

</div>
<canvas id="gl" aria-hidden="true"></canvas>
<div class="overlay top"><span>Mercury Sessions</span><span>Vol. 04</span></div>
<div class="overlay title"><h1>Melt<br>Down</h1></div>
<div class="overlay bottom">
  <div class="date">Fri 13 Mar · Warehouse 9</div>
  <div class="acts">Aiko Rheims · Tunde Vale · Static Orchard<br>doors 22:00 — close 06:00<br><a class="cta" href="#tickets">Tickets</a></div>
</div>
<p class="gl-note" role="status">Static poster: this browser has no WebGL.</p>
<script>
var GLX = (function () {
  var root = document.documentElement;
  function fail(why) {
    root.classList.remove('gl-on');
    root.classList.add('gl-off');
    if (why) console.warn('[webgl] ' + why);
    return null;
  }
  function compile(gl, type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.error(gl.getShaderInfoLog(s));
      return null;
    }
    return s;
  }
  function program(gl, vs, fs) {
    var v = compile(gl, gl.VERTEX_SHADER, vs), f = compile(gl, gl.FRAGMENT_SHADER, fs);
    if (!v || !f) return null;
    var p = gl.createProgram();
    gl.attachShader(p, v); gl.attachShader(p, f); gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(p)); return null; }
    return p;
  }
  function start(setup) {
    var canvas = document.getElementById('gl');
    var gl = null;
    try {
      var opts = { alpha: false, antialias: true, premultipliedAlpha: false };
      gl = canvas.getContext('webgl2', opts) || canvas.getContext('webgl', opts);
    } catch (_) {}
    if (!gl) return fail('no WebGL context; showing the static poster');
    var still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    var pointer = [0.5, 0.5], targetPointer = [0.5, 0.5];
    window.addEventListener('pointermove', function (e) {
      targetPointer = [e.clientX / innerWidth, 1 - e.clientY / innerHeight];
    }, { passive: true });
    var draw = setup(gl, { program: function (vs, fs) { return program(gl, vs, fs); } });
    if (!draw) return fail('shader setup failed; showing the static poster');
    function resize() {
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var w = Math.max(1, Math.round(canvas.clientWidth * dpr));
      var h = Math.max(1, Math.round(canvas.clientHeight * dpr));
      if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
      gl.viewport(0, 0, w, h);
    }
    var t0 = performance.now(), raf = 0, shown = false, lost = false;
    function frame(now) {
      raf = 0;
      if (lost) return;
      resize();
      pointer[0] += (targetPointer[0] - pointer[0]) * 0.06;
      pointer[1] += (targetPointer[1] - pointer[1]) * 0.06;
      var t = still ? 6.0 : (now - t0) / 1000;
      draw(t, [canvas.width, canvas.height], pointer);
      if (!shown) {
        shown = true;
        var err = gl.getError();
        if (err !== gl.NO_ERROR) console.warn('[webgl] getError after first frame: ' + err);
        root.classList.add('gl-on');
      }
      if (!still && !document.hidden) raf = requestAnimationFrame(frame);
    }
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && !raf && !still) raf = requestAnimationFrame(frame);
    });
    window.addEventListener('resize', function () { if (still && !raf) raf = requestAnimationFrame(frame); });
    canvas.addEventListener('webglcontextlost', function (e) { e.preventDefault(); lost = true; fail('context lost'); });
    raf = requestAnimationFrame(frame);
    return gl;
  }
  // Full-screen triangle + one fragment shader with uRes, uTime, uPointer.
  var FS_VERT = 'attribute vec2 aPos; void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }';
  function fragment(src, extra) {
    return start(function (gl, h) {
      var p = h.program(FS_VERT, src);
      if (!p) return null;
      var buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
      var loc = gl.getAttribLocation(p, 'aPos');
      var uRes = gl.getUniformLocation(p, 'uRes');
      var uTime = gl.getUniformLocation(p, 'uTime');
      var uPointer = gl.getUniformLocation(p, 'uPointer');
      return function (t, res, ptr) {
        gl.useProgram(p);
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
        gl.uniform2f(uRes, res[0], res[1]);
        gl.uniform1f(uTime, t);
        if (uPointer) gl.uniform2f(uPointer, ptr[0], ptr[1]);
        if (extra) extra(gl, p, t);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
      };
    });
  }
  // Column-major perspective and look-at for the 3D point scenes.
  function perspective(fovy, aspect, near, far) {
    var f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);
    return [f / aspect, 0, 0, 0, 0, f, 0, 0, 0, 0, (far + near) * nf, -1, 0, 0, 2 * far * near * nf, 0];
  }
  function mul(a, b) {
    var o = new Array(16);
    for (var c = 0; c < 4; c++) for (var r = 0; r < 4; r++) {
      var s = 0;
      for (var k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k];
      o[c * 4 + r] = s;
    }
    return o;
  }
  function lookAt(eye, at, up) {
    function sub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
    function norm(a) { var l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; }
    function cross(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
    function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
    var z = norm(sub(eye, at)), x = norm(cross(up, z)), y = cross(z, x);
    return [x[0], y[0], z[0], 0, x[1], y[1], z[1], 0, x[2], y[2], z[2], 0, -dot(x, eye), -dot(y, eye), -dot(z, eye), 1];
  }
  return { start: start, fragment: fragment, perspective: perspective, mul: mul, lookAt: lookAt };
})();
GLX.fragment([
  'precision highp float;',
  'uniform vec2 uRes;',
  'uniform float uTime;',
  'uniform vec2 uPointer;',
  '',
  'float smin(float a, float b, float k){ float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0); return mix(b, a, h) - k * h * (1.0 - h); }',
  'float map(vec3 p){',
  '  float t = uTime * 0.5;',
  '  float d = length(p - vec3(sin(t) * 0.9, cos(t * 1.3) * 0.4, 0.0)) - 0.55;',
  '  d = smin(d, length(p - vec3(cos(t * 0.7) * 1.1, sin(t * 0.9) * 0.5, sin(t) * 0.3)) - 0.45, 0.45);',
  '  d = smin(d, length(p - vec3(sin(t * 1.1 + 2.0) * 0.7, sin(t * 0.6) * 0.6, cos(t * 0.8) * 0.4)) - 0.38, 0.45);',
  '  d = smin(d, length(p - vec3(cos(t * 0.5 + 1.0) * 1.3, cos(t * 1.2) * 0.3, 0.2)) - 0.32, 0.45);',
  '  vec2 m = (uPointer - 0.5) * vec2(3.0, 1.8);',
  '  d = smin(d, length(p - vec3(m, 0.4)) - 0.28, 0.5);',
  '  return d;',
  '}',
  'vec3 normal(vec3 p){',
  '  vec2 e = vec2(0.001, 0.0);',
  '  return normalize(vec3(map(p + e.xyy) - map(p - e.xyy), map(p + e.yxy) - map(p - e.yxy), map(p + e.yyx) - map(p - e.yyx)));',
  '}',
  'vec3 env(vec3 d){',
  '  vec3 c = mix(vec3(0.02, 0.02, 0.03), vec3(0.35, 0.36, 0.4), smoothstep(-0.2, 0.9, d.y));',
  '  c += vec3(1.0) * smoothstep(0.92, 0.99, 1.0 - abs(d.x - 0.45)) * smoothstep(0.0, 0.4, d.y) * 1.4;',
  '  c += vec3(0.9) * smoothstep(0.95, 0.995, 1.0 - abs(d.x + 0.6)) * smoothstep(-0.1, 0.3, d.y);',
  '  c += vec3(1.0, 0.24, 0.55) * smoothstep(0.0, -0.6, d.y) * 0.9;',
  '  return c;',
  '}',
  'void main(){',
  '  vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;',
  '  vec3 ro = vec3(0.0, 0.0, 3.4), rd = normalize(vec3(uv, -1.6));',
  '  float t = 0.0; bool hit = false;',
  '  for (int i = 0; i < 90; i++) {',
  '    float d = map(ro + rd * t);',
  '    if (d < 0.001) { hit = true; break; }',
  '    t += d;',
  '    if (t > 8.0) break;',
  '  }',
  '  vec3 col = vec3(0.03, 0.027, 0.043) + 0.06 * vec3(1.0, 0.24, 0.55) * smoothstep(0.6, -0.6, uv.y);',
  '  if (hit) {',
  '    vec3 p = ro + rd * t, n = normal(p);',
  '    vec3 r = reflect(rd, n);',
  '    float fr = pow(1.0 - max(dot(n, -rd), 0.0), 4.0);',
  '    col = env(r) * (0.75 + 0.25 * fr) + fr * 0.25;',
  '  }',
  '  col = col / (1.0 + col);',
  '  col = pow(col, vec3(0.85));',
  '  gl_FragColor = vec4(col * 1.25, 1.0);',
  '}'
].join('\n'));
</script>
</body>
</html>
