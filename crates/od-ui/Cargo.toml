[package]
name = "od-ui"
description = "Open Design UI: Leptos CSR app compiled to WASM with trunk, served by the daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
od-contracts.workspace = true
console_error_panic_hook = "0.1"
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
send_wrapper = "0.6"
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Crypto",
    "Document",
    "Element",
    "EventSource",
    "HtmlElement",
    "HtmlIFrameElement",
    "KeyboardEvent",
    "Location",
    "MediaQueryList",
    "MessageEvent",
    "Navigator",
    "Window",
] }

# The mock daemon used by the e2e test runs natively next to the real router.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
anyhow.workspace = true
axum.workspace = true
od-content.workspace = true
od-server.workspace = true
od-store.workspace = true
tokio.workspace = true
tokio-stream = { version = "0.1", features = ["sync"] }
tracing-subscriber.workspace = true
uuid.workspace = true

[lints]
workspace = true
