[package]
name = "od-ui"
description = "Nét UI: Leptos CSR app compiled to WASM with trunk, served by the daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
od-contracts.workspace = true
console_error_panic_hook = "0.1"
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
send_wrapper = "0.6"
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "AudioContext",
    "AudioDestinationNode",
    "AudioNode",
    "AudioParam",
    "BaseAudioContext",
    "BinaryType",
    "Blob",
    "BlobPropertyBag",
    "CanvasRenderingContext2d",
    "Clipboard",
    "Crypto",
    "Document",
    "Element",
    "File",
    "FileList",
    "FormData",
    "EventSource",
    "File",
    "FileList",
    "FormData",
    "GainNode",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlIFrameElement",
    "HtmlImageElement",
    "HtmlInputElement",
    "IntersectionObserver",
    "IntersectionObserverEntry",
    "IntersectionObserverInit",
    "KeyboardEvent",
    "Location",
    "MediaQueryList",
    "MessageEvent",
    "MouseEvent",
    "Navigator",
    "NodeList",
    "Notification",
    "NotificationOptions",
    "NotificationPermission",
    "OscillatorNode",
    "OscillatorType",
    "PointerEvent",
    "Storage",
    "Url",
    "UrlSearchParams",
    "WebSocket",
    "Window",
] }

[lints]
workspace = true
