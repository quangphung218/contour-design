[package]
name = "od-fs"
description = "File access in folders an agent can write: no link followed, no FIFO waited on"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# `od_fs::hostile` for another crate's tests: take it as a dev-dependency only.
test-support = ["dep:tempfile"]

[dependencies]
hex.workspace = true
sha2.workspace = true
tempfile = { workspace = true, optional = true }
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
nix.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
