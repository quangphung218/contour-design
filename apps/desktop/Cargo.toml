[package]
name = "od-desktop"
description = "Contour desktop shell (Tauri 2): runs od-server in-process on a random loopback port"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "od-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
od-cli.workspace = true
od-content.workspace = true
od-mcp.workspace = true
od-runtime.workspace = true
od-server.workspace = true
od-store.workspace = true
anyhow.workspace = true
axum.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# No `zip`: only Tauri v1 bundles (`v1Compatible`) need it; ours are v2.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
# A second launch shows the running window and quits (src/data_lock.rs).
tauri-plugin-single-instance = "2"
# The start-up dialog's language when the app has none set (src/data_lock.rs).
sys-locale = "0.3"
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

# The JavaScript panels wry's macOS UI delegate lacks (`src/js_dialogs.rs`);
# the versions wry 0.55 itself uses.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSAlert", "NSApplication", "NSButton", "NSCell", "NSControl", "NSEvent", "NSFont", "NSMenu", "NSResponder", "NSScrollView", "NSText", "NSTextField", "NSTextView", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSBundle", "NSDate", "NSGeometry", "NSObjCRuntime", "NSRunLoop", "NSString", "NSTimer", "NSURL"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKFrameInfo", "WKSecurityOrigin", "WKUIDelegate", "WKWebView"] }

[dev-dependencies]
base64.workspace = true
minisign = "0.10"
tauri = { version = "2", features = ["test"] }
tempfile.workspace = true

# The workspace's lints, but `unsafe_code` denied rather than forbidden:
# `src/js_dialogs.rs` allows it to add Objective-C methods (QA-064,
# decision 7). A copy of `[workspace.lints]` in the root Cargo.toml: keep
# the two in step.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
dbg_macro = "warn"

