name: Feature request
description: Suggest something Contour should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should Contour do? UI, CLI or API, whichever fits.
    validations:
      required: true
  - type: textarea
    id: upstream
    attributes:
      label: OpenDesign parity
      description: Does the original OpenDesign app do this? See docs/parity.md.
  - type: checkboxes
    id: local
    attributes:
      label: Local-first
      options:
        - label: This works without an account, a cloud service or telemetry
          required: true
