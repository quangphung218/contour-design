# CI: lint, test, e2e and dependency policy. Pull requests and pushes to
# main run on Linux, plus the workspace tests on Windows; the macOS tests
# and the Windows build run on a manual dispatch (with the other jobs) or
# when release.yml calls this workflow, once per platform (`only: macos`,
# `only: windows`). A pull request that changes how Chrome starts or
# renders (`chrome-paths`), and a manual dispatch, also run the Chrome
# tests on macOS (`chrome-macos`): LaunchServices exists only there. Docs links,
# script tests, actionlint and commit messages live in docs.yml, which also
# runs for docs-only changes. `make ci` runs the checks locally and is the
# main gate on macOS (docs/development.md).
name: CI

on:
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:
  workflow_call:
    inputs:
      only:
        description: Called by release.yml; run just the macOS tests (macos) or the Windows build (windows)
        type: string
        default: ""
      ref:
        description: Ref to check out (the release tag)
        type: string
        default: ""

concurrency:
  # `only` keeps release.yml's two calls in one run from cancelling each other.
  group: ci-${{ github.workflow }}-${{ inputs.only }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "4"
  RUST_BACKTRACE: "1"

jobs:
  lint:
    name: fmt + clippy (native, wasm)
    # In a called workflow `github.event_name` is the caller's event, so the
    # jobs go by the `only` input instead.
    if: ${{ !inputs.only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Into ./target, which rust-cache saves (as in the e2e job).
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0  # pinned: a new stable brings new clippy lints; bump by PR
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: trunk
      - name: Linux packages
        run: scripts/linux-deps.sh
      - run: make lint
      # THIRD-PARTY-LICENSES must match Cargo.lock (`make licenses`). The
      # NOTICE modified-files part needs an open-design checkout and is
      # checked by `make check` locally.
      - name: Third-party licenses
        run: scripts/licenses.py check

  test:
    name: test (${{ matrix.os }})
    if: inputs.only != 'windows'
    strategy:
      fail-fast: false
      matrix:
        # Release: macOS; dispatch: both; pull requests and main: Linux.
        os: ${{ fromJSON(inputs.only == 'macos' && '["macos-15"]' || (github.event_name == 'workflow_dispatch' && '["macos-15", "ubuntu-24.04"]' || '["ubuntu-24.04"]')) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # Into ./target, which rust-cache saves (as in the e2e job).
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0  # pinned: a new stable brings new clippy lints; bump by PR
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: trunk
      # The debug build of every test binary outgrows the ~14 GB free on the
      # Linux runner ("No space left on device"); drop toolchains we never use.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Linux packages
        if: runner.os == 'Linux'
        run: scripts/linux-deps.sh
      # The MP4 export tests need ffmpeg and ffprobe, and fail without them.
      - name: ffmpeg
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install ffmpeg
          else
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -n1
      - run: make test

  # Whether a pull request touches how Chrome starts or renders.
  chrome-paths:
    name: changed paths (Chrome)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      chrome: ${{ steps.diff.outputs.chrome }}
    steps:
      # The merge commit and its first parent, the base branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: diff
        run: |
          git diff --name-only HEAD^1 HEAD | tee changed.txt
          if grep -qE '^(crates/od-render-cdp/|crates/od-cli/|Cargo\.lock$|\.github/workflows/ci\.yml$)' changed.txt; then
            echo chrome=true >> "$GITHUB_OUTPUT"
          else
            echo chrome=false >> "$GITHUB_OUTPUT"
          fi

  # The Chrome tests on macOS for such a pull request: there a browser in an
  # `.app` starts through LaunchServices, which the Linux job never runs
  # (v0.2.0-beta.42 shipped a start that hung on every macOS runner). The
  # tests in tests/launch_services.rs that run Chrome inside a throwaway
  # bundle stay manual: there Chrome never opened DevTools, approved or not.
  chrome-macos:
    name: Chrome on macOS (LaunchServices)
    needs: chrome-paths
    # Also on a manual dispatch, where `chrome-paths` is skipped.
    if: ${{ !cancelled() && (needs.chrome-paths.outputs.chrome == 'true' || (github.event_name == 'workflow_dispatch' && !inputs.only)) }}
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0  # pinned: a new stable brings new clippy lints; bump by PR
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: trunk
      # The MP4 export tests need ffmpeg and ffprobe, and fail without them.
      - name: ffmpeg
        run: |
          brew install ffmpeg
          ffmpeg -version | head -n1
      - run: make ui-dist
      # The runner's Chrome as Homebrew left it: quarantined, never
      # approved, so every export takes the child fallback.
      - run: cargo test -p od-render-cdp -p od-cli
      # Then approved, as a Chrome opened once from Finder: the same
      # exports go through LaunchServices, and a test checks that they do.
      - name: Chrome approved, through LaunchServices
        env:
          OD_EXPECT_LAUNCH_SERVICES: "1"
        run: |
          sudo xattr -d com.apple.quarantine "/Applications/Google Chrome.app"
          cargo test -p od-render-cdp --lib the_installed_chrome_starts_through_launch_services
          cargo test -p od-render-cdp --test chrome
          cargo test -p od-cli --test m5 export_cli_writes_every_format

  # The workspace tests on Windows: agent lookup (`.cmd` shims, the user's
  # Path in the registry), the Job Object, paths and file URLs.
  test-windows:
    name: test (windows-2025)
    if: ${{ !inputs.only }}
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0  # pinned: a new stable brings new clippy lints; bump by PR
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: trunk
      # The MP4 export tests need ffmpeg and ffprobe, and fail without them.
      - name: ffmpeg
        shell: bash
        run: |
          choco install ffmpeg -y --no-progress > /dev/null
          ffmpeg -version | head -n1
      - name: UI bundle
        working-directory: crates/od-ui
        run: trunk build
      - run: cargo test --workspace --no-fail-fast

  # The Windows build that release.yml calls (`only: windows`) and a manual
  # run: every target, as the release bundle builds it.
  build-windows:
    name: build (windows)
    if: inputs.only == 'windows' || (!inputs.only && github.event_name == 'workflow_dispatch')
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0  # pinned: a new stable brings new clippy lints; bump by PR
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: trunk
      - name: UI bundle
        working-directory: crates/od-ui
        run: trunk build
      - run: cargo build --workspace --all-targets

  e2e:
    name: e2e (Playwright)
    if: ${{ !inputs.only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # The Makefile builds into ~/.cache/odrs-target-<dir>, which
      # rust-cache does not save (it saves ./target): every run compiled
      # the ~450 crates of the UI and `od` again (5 minutes).
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      # Scenarios at once (crates/od-ui/e2e/run.sh); the runner has 4 CPUs
      # and 16 GB.
      OD_E2E_JOBS: "3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0  # pinned: a new stable brings new clippy lints; bump by PR
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: trunk
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/od-ui/e2e/package-lock.json
      - name: Playwright
        working-directory: crates/od-ui/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium webkit
      # motion.e2e.mjs renders an MP4 and checks it with ffprobe.
      - name: ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n1
      - run: make e2e
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-results
          path: crates/od-ui/e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

  deny:
    name: cargo-deny (licenses, advisories)
    if: ${{ !inputs.only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses advisories bans sources
