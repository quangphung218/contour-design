# CI in two tiers (docs/development.md, Continuous integration).
#
# Pull requests and pushes to main: the `changes` job reads what changed
# (scripts/ci-changes.sh) and picks the jobs.
#   code     lint, test (Linux), e2e, cargo-deny; plus the Windows tests and
#            the Chrome tests on macOS when the change reaches them
#   version  nothing beyond `changes`, which checks that the diff is only
#            what `make version` writes; the tag build tests the release
#   docs     nothing beyond `changes` (docs.yml checks the links)
# `CI result` passes when every job that ran passed: the one check to
# require for merging.
#
# Everything (`only: full`): a manual dispatch and nightly.yml run every job
# on every OS: Linux, macOS and Windows tests, the Chrome tests on macOS,
# the Windows build. release.yml calls this workflow twice for a tag:
# `only: release` (every test, the Windows tests included; the draft
# release waits for it, so no release goes out with Windows red) and
# `only: windows` (the Windows build only; best effort, never blocks). Docs links, script tests, actionlint and commit messages live in
# docs.yml. `make ci` runs the checks locally and is the main gate on macOS.
#
# Rust caches are saved from main only (pushes, nightly): a cache saved by
# a pull request or a tag serves only that ref, and those filled the 10 GB
# repository cache until main's were evicted.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      only:
        description: "Called by nightly.yml and release.yml: full (every job), release (every test, Windows included; no Windows build) or windows (the Windows build)"
        type: string
        default: ""
      ref:
        description: Ref to check out (the release tag)
        type: string
        default: ""

concurrency:
  # `only` keeps release.yml's two calls in one run from cancelling each other.
  group: ci-${{ github.workflow }}-${{ inputs.only }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "4"
  RUST_BACKTRACE: "1"
  # No new CARGO_* or RUST* variable here: rust-cache hashes them into its
  # key, and a new one leaves every job without main's cache. cargo and
  # rustup try a failed download again by themselves.

jobs:
  changes:
    name: changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      kind: ${{ steps.plan.outputs.kind }}
      lint: ${{ steps.plan.outputs.lint }}
      test-os: ${{ steps.plan.outputs.test-os }}
      e2e: ${{ steps.plan.outputs.e2e }}
      deny: ${{ steps.plan.outputs.deny }}
      windows-test: ${{ steps.plan.outputs.windows-test }}
      windows-build: ${{ steps.plan.outputs.windows-build }}
      chrome: ${{ steps.plan.outputs.chrome }}
    steps:
      # A pull request: the merge commit and its first parent, the base
      # branch. A push: the pushed commit; the one before is fetched below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ !inputs.only && github.event_name != 'workflow_dispatch' }}
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Plan
        id: plan
        env:
          ONLY: ${{ inputs.only }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$ONLY" ]; then mode="$ONLY"
          elif [ "$EVENT" = workflow_dispatch ]; then mode=full
          else mode=changes; fi
          kind=code lint=false linux=false macos=false e2e=false deny=false
          windows_test=false windows_build=false chrome=false
          case "$mode" in
            full)
              lint=true linux=true macos=true e2e=true deny=true
              windows_test=true windows_build=true chrome=true ;;
            release)
              lint=true linux=true macos=true e2e=true deny=true chrome=true
              windows_test=true ;;
            windows)
              windows_build=true ;;
            changes)
              if [ "$EVENT" = pull_request ]; then
                base="$(git rev-parse HEAD^1)"
              else
                base="$BEFORE"
                git fetch --no-tags --depth=1 origin "$base" 2> /dev/null || true
              fi
              scripts/ci-changes.sh "$base" HEAD > "$RUNNER_TEMP/changes" 2> "$RUNNER_TEMP/why"
              cat "$RUNNER_TEMP/why"
              kind="$(sed -n 's/^kind=//p' "$RUNNER_TEMP/changes")"
              if [ "$kind" = code ]; then
                lint=true linux=true e2e=true deny=true
                windows_test="$(sed -n 's/^windows=//p' "$RUNNER_TEMP/changes")"
                chrome="$(sed -n 's/^chrome=//p' "$RUNNER_TEMP/changes")"
              fi ;;
            *)
              echo "::error::unknown only: $mode (full, release or windows)"
              exit 1 ;;
          esac
          os=()
          [ "$linux" = false ] || os+=('"ubuntu-24.04"')
          [ "$macos" = false ] || os+=('"macos-15"')
          test_os="[$(IFS=,; echo "${os[*]-}")]"
          {
            echo "kind=$kind"
            echo "lint=$lint"
            echo "test-os=$test_os"
            echo "e2e=$e2e"
            echo "deny=$deny"
            echo "windows-test=$windows_test"
            echo "windows-build=$windows_build"
            echo "chrome=$chrome"
          } | tee -a "$GITHUB_OUTPUT"
          {
            echo "## Plan: $mode, $kind"
            echo
            echo "lint $lint · test $test_os · e2e $e2e · deny $deny · Windows tests $windows_test · Windows build $windows_build · Chrome on macOS $chrome"
            if [ -s "$RUNNER_TEMP/why" ]; then echo; sed 's/^/- /' "$RUNNER_TEMP/why"; fi
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: fmt + clippy (native, wasm)
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Into ./target, which rust-cache saves (as in the e2e job).
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0  # pinned: a new stable brings new clippy lints; bump by PR
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: trunk
      # Downloaded .deb files (scripts/linux-deps.sh, APT_ARCHIVES): the
      # newest saved folder is restored every run; main saves it when apt
      # changed it, also after a failed try, so the next run goes on. A
      # pull request saves one when apt gave up, or when it found none of
      # this job's (that cache serves only the pull request), so running it
      # again goes on from there instead of from zero.
      # apt gets 10 minutes in all (APT_BUDGET_SECONDS), then the step
      # fails naming the mirror, instead of using up the job's time.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: apt-cache
        with:
          path: ~/.cache/apt-archives
          key: apt-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: apt-${{ github.job }}-
      - name: Linux packages
        id: deps
        env:
          APT_BUDGET_SECONDS: "600"
        run: APT_ARCHIVES="$HOME/.cache/apt-archives" scripts/linux-deps.sh
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() && (github.ref == 'refs/heads/main' || steps.deps.outcome == 'failure' || !startsWith(steps.apt-cache.outputs.cache-matched-key, format('apt-{0}-', github.job))) && steps.deps.outputs.archives-changed == 'true' }}
        with:
          path: ~/.cache/apt-archives
          key: apt-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
      - run: make lint
      # THIRD-PARTY-LICENSES must match Cargo.lock (`make licenses`). The
      # NOTICE modified-files part needs an open-design checkout and is
      # checked by `make check` locally.
      - name: Third-party licenses
        run: scripts/licenses.py check

  # Linux on every code change; macOS too in the full tier.
  test:
    name: test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.test-os != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.test-os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # Into ./target, which rust-cache saves (as in the e2e job).
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0  # pinned: a new stable brings new clippy lints; bump by PR
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: trunk,cargo-nextest
      # The debug build of every test binary outgrows the ~14 GB free on the
      # Linux runner ("No space left on device"); drop toolchains we never use.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL
          df -h /
      # The MP4 export tests need ffmpeg and ffprobe, and fail without them.
      # On Linux it joins the Tauri packages: one apt install, with the
      # step limit and tries of linux-deps.sh.
      # Downloaded .deb files and the 10-minute limit, as in the lint job.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: apt-cache
        if: runner.os == 'Linux'
        with:
          path: ~/.cache/apt-archives
          key: apt-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: apt-${{ github.job }}-
      - name: Linux packages and ffmpeg
        id: deps
        if: runner.os == 'Linux'
        env:
          APT_BUDGET_SECONDS: "600"
        run: APT_ARCHIVES="$HOME/.cache/apt-archives" scripts/linux-deps.sh ffmpeg
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() && runner.os == 'Linux' && (github.ref == 'refs/heads/main' || steps.deps.outcome == 'failure' || !startsWith(steps.apt-cache.outputs.cache-matched-key, format('apt-{0}-', github.job))) && steps.deps.outputs.archives-changed == 'true' }}
        with:
          path: ~/.cache/apt-archives
          key: apt-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: ffmpeg
        if: runner.os == 'macOS'
        run: scripts/ci-retry.sh brew install ffmpeg
      - run: ffmpeg -version | head -n1
      - run: make ui-dist test-scripts
      # nextest runs the test binaries side by side (cargo test runs them
      # one after another); .config/nextest.toml keeps the watcher tests
      # serial. Doc tests are the part nextest does not run.
      - name: Tests (nextest)
        run: cargo nextest run --workspace --profile ci
      - name: Doc tests
        run: cargo test --workspace --doc

  # The Chrome tests on macOS: there a browser in an `.app` starts through
  # LaunchServices, which the Linux job never runs (v0.2.0-beta.42 shipped a
  # start that hung on every macOS runner). The tests in
  # tests/launch_services.rs that run Chrome inside a throwaway bundle stay
  # manual: there Chrome never opened DevTools, approved or not.
  chrome-macos:
    name: Chrome on macOS (LaunchServices)
    needs: changes
    if: needs.changes.outputs.chrome == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0  # pinned: a new stable brings new clippy lints; bump by PR
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: trunk
      # The MP4 export tests need ffmpeg and ffprobe, and fail without them.
      - name: ffmpeg
        run: |
          scripts/ci-retry.sh brew install ffmpeg
          ffmpeg -version | head -n1
      - run: make ui-dist
      # The runner's Chrome as the image left it: on most images quarantined
      # by Homebrew and never approved, so every export takes the child
      # fallback.
      - run: cargo test -p od-render-cdp -p od-cli
      # Then approved, as a Chrome opened once from Finder: the same
      # exports go through LaunchServices, and a test checks that they do.
      - name: Chrome approved, through LaunchServices
        env:
          OD_EXPECT_LAUNCH_SERVICES: "1"
        run: |
          # Some runner images leave Chrome unquarantined already.
          chrome="/Applications/Google Chrome.app"
          if xattr -p com.apple.quarantine "$chrome" > /dev/null 2>&1; then
            sudo xattr -d com.apple.quarantine "$chrome"
          fi
          cargo test -p od-render-cdp --lib the_installed_chrome_starts_through_launch_services
          cargo test -p od-render-cdp --test chrome
          cargo test -p od-cli --test m5 export_cli_writes_every_format

  # The workspace tests on Windows: agent lookup (`.cmd` shims, the user's
  # Path in the registry), the Job Object, paths and file URLs.
  test-windows:
    name: test (windows-2025)
    needs: changes
    if: needs.changes.outputs.windows-test == 'true'
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0  # pinned: a new stable brings new clippy lints; bump by PR
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: trunk
      # The MP4 export tests need ffmpeg and ffprobe, and fail without them.
      - name: ffmpeg
        shell: bash
        run: |
          scripts/ci-retry.sh choco install ffmpeg -y --no-progress > /dev/null
          ffmpeg -version | head -n1
      - name: UI bundle
        working-directory: crates/od-ui
        run: trunk build
      - run: cargo test --workspace --no-fail-fast

  # Every target, as the release bundle builds it.
  build-windows:
    name: build (windows)
    needs: changes
    if: needs.changes.outputs.windows-build == 'true'
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0  # pinned: a new stable brings new clippy lints; bump by PR
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: trunk
      - name: UI bundle
        working-directory: crates/od-ui
        run: trunk build
      - run: cargo build --workspace --all-targets

  # Two shards side by side (run.sh, OD_E2E_SHARD): in one job the e2e
  # took 13-16 minutes (3 to build, 8-9 for 21 scenarios), the longest job
  # of a pull request.
  e2e:
    name: e2e (Playwright, ${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # The Makefile builds into ~/.cache/odrs-target-<dir>, which
      # rust-cache does not save (it saves ./target): every run compiled
      # the ~450 crates of the UI and `od` again (5 minutes).
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      # Scenarios at once (crates/od-ui/e2e/run.sh); the runner has 4 CPUs
      # and 16 GB.
      OD_E2E_JOBS: "3"
      # A failed scenario runs once more on its own; one that passes then
      # is listed under "flaky" in the job summary.
      OD_E2E_RETRIES: "1"
      OD_E2E_SHARD: ${{ matrix.shard }}/2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0  # pinned: a new stable brings new clippy lints; bump by PR
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: trunk
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/od-ui/e2e/package-lock.json
      - name: npm packages
        working-directory: crates/od-ui/e2e
        run: ../../../scripts/ci-retry.sh npm ci --no-audit --no-fund
      # The system packages of Chromium and WebKit, and ffmpeg (motion.e2e
      # renders an MP4 and checks it with ffprobe), through linux-deps.sh:
      # a .deb cache as in the lint job, a time limit on every apt call,
      # and 10 minutes for all of them. `playwright install --with-deps`
      # ran its own apt-get with none of these: on 18-19/11 it took 35 to
      # 44 minutes for 126 MB (47 kB/s) and the job hit its 45 minutes.
      # Shard 1 saves the folder; both download the same packages.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: apt-cache
        with:
          path: ~/.cache/apt-archives
          key: apt-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          # Before e2e has a folder of its own: the test job's, which
          # holds WebKitGTK, GStreamer and ffmpeg, most of what is needed.
          restore-keys: |
            apt-${{ github.job }}-
            apt-test-
      - name: Linux packages (Playwright, ffmpeg)
        id: deps
        env:
          APT_BUDGET_SECONDS: "600"
        run: APT_ARCHIVES="$HOME/.cache/apt-archives" scripts/linux-deps.sh --playwright crates/od-ui/e2e ffmpeg
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() && matrix.shard == 1 && (github.ref == 'refs/heads/main' || steps.deps.outcome == 'failure' || !startsWith(steps.apt-cache.outputs.cache-matched-key, format('apt-{0}-', github.job))) && steps.deps.outputs.archives-changed == 'true' }}
        with:
          path: ~/.cache/apt-archives
          key: apt-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
      - run: ffmpeg -version | head -n1
      # The browsers come from Playwright's CDN (8 s on 19/11), not apt, so
      # a time limit stops the whole download.
      - name: Playwright browsers
        working-directory: crates/od-ui/e2e
        run: ../../../scripts/ci-retry.sh timeout 300 npx playwright install chromium webkit
      - run: make e2e
      # Scenarios that failed and then passed alone (run.sh writes
      # flaky.txt): a warning, and rows for docs/qa/flaky.md.
      - name: Flaky scenarios
        id: flaky
        if: ${{ !cancelled() }}
        run: |
          list=crates/od-ui/e2e/test-results/logs/flaky.txt
          [ -s "$list" ] || exit 0
          echo "any=true" >> "$GITHUB_OUTPUT"
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          day="$(date -u +%F)"
          {
            echo "## flaky"
            echo
            echo "Failed, then passed when run again on their own. Rows for docs/qa/flaky.md:"
            echo
            echo '```'
            while read -r name; do echo "| $name | $day | $run |"; done < "$list"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          while read -r name; do
            echo "::warning::flaky e2e: $name failed, then passed on its own"
            echo "flaky-row: | $name | $day | $run |"
          done < "$list"
      - name: Upload screenshots and logs
        if: failure() || steps.flaky.outputs.any == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-results-${{ matrix.shard }}
          path: crates/od-ui/e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

  deny:
    name: cargo-deny (licenses, advisories)
    needs: changes
    if: needs.changes.outputs.deny == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses advisories bans sources

  # Passes when every job that ran passed (a skipped job counts as passed):
  # a version-only or docs-only pull request passes here too.
  result:
    name: CI result
    needs: [changes, lint, test, chrome-macos, test-windows, build-windows, e2e, deny]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job that ran passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          KIND: ${{ needs.changes.outputs.kind }}
        run: |
          jq -r 'to_entries[] | "\(.key) \(.value.result)"' <<< "$NEEDS" > "$RUNNER_TEMP/results"
          {
            echo "## CI result (${KIND:-?})"
            echo
            echo "| job | result |"
            echo "|---|---|"
            awk '{print "| " $1 " | " $2 " |"}' "$RUNNER_TEMP/results"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/results"
          bad="$(awk '$2 == "failure" || $2 == "cancelled" {printf "%s ", $1}' "$RUNNER_TEMP/results")"
          if [ -n "$bad" ]; then
            echo "::error::failed or cancelled: $bad"
            exit 1
          fi
