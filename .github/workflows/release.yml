# Release: a `v*` tag builds the desktop bundles and opens a draft GitHub
# Release with the matching CHANGELOG.md section and SHA256SUMS.
# docs/release.md walks through the whole process.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.1.0
        required: true

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  # Keep in sync with the Makefile (TAURI_CLI_VERSION).
  TAURI_CLI_VERSION: 2.12.4

jobs:
  check:
    name: tag matches Cargo.toml and CHANGELOG.md
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Compare versions
        run: |
          version="$(awk '/^\[workspace.package\]/{p=1;next} /^\[/{p=0} p && /^version *=/{gsub(/[" ]/,"");sub(/version=/,"");print;exit}' Cargo.toml)"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $version (run make version V=...)"
            exit 1
          fi
          scripts/release-notes.sh "$TAG" > /dev/null

  # The macOS tests (ci.yml): pull requests run on Linux only, so a release
  # is where macOS is tested on CI. The bundles build alongside them; the
  # draft release waits for them, so a failure still stops the release.
  macos-tests:
    name: macOS tests
    needs: check
    uses: ./.github/workflows/ci.yml
    with:
      only: macos
      # `env` is not available here.
      ref: ${{ github.event.inputs.tag || github.ref_name }}

  # The Windows compile check runs too, but nothing waits for it: Windows is
  # best effort (README, Known limitations), like its bundle below. A failure
  # still shows on the run.
  windows-build:
    name: Windows build (does not block)
    needs: check
    uses: ./.github/workflows/ci.yml
    with:
      only: windows
      ref: ${{ github.event.inputs.tag || github.ref_name }}

  # Rust caches saved by a tag run are scoped to that tag, so the next tag
  # finds none (only main's caches are shared). Only a manual run saves them
  # (`save-if`): dispatched from main, its caches reach every later tag.
  # The UI comes from the ui job below, built once for every bundle.
  bundle:
    name: bundle (${{ matrix.name }})
    needs: [check, ui]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 keeps the AppImage loadable on older glibc.
          - name: linux-x64
            os: ubuntu-22.04
            args: --bundles appimage,deb
            out: target/release/bundle
            best_effort: false
          # Best effort: a failed Windows build does not stop the release.
          # An installer that builds must pass the Windows smoke test below.
          - name: windows-x64
            os: windows-2025
            args: --bundles msi
            out: target/release/bundle
            best_effort: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.best_effort }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ matrix.name }}
          save-if: ${{ github.event_name == 'workflow_dispatch' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Linux packages
        if: runner.os == 'Linux'
        run: scripts/linux-deps.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-dist
          path: crates/od-ui/dist
      - name: UI bundle present
        shell: bash
        run: test -f crates/od-ui/dist/index.html
      - name: Tauri bundle
        working-directory: apps/desktop
        shell: bash
        run: |
          extra=()
          if [ "$RUNNER_OS" = Windows ]; then
            # WiX takes numbers only; 0.2.0-beta.2 becomes 0.2.0.102 (scripts/msi-version.sh).
            msi="$(../../scripts/msi-version.sh "$TAG")"
            extra=(--config "{\"bundle\":{\"windows\":{\"wix\":{\"version\":\"$msi\"}}}}")
          fi
          npx --yes "@tauri-apps/cli@$TAURI_CLI_VERSION" build ${{ matrix.args }} ${extra[@]+"${extra[@]}"}
      - name: Collect files
        shell: bash
        run: |
          mkdir -p dist-release
          find "${{ matrix.out }}" -maxdepth 2 -type f \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*.msi' \) \
            -exec cp {} dist-release/ \;
          ls -l dist-release
          test -n "$(ls dist-release)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ matrix.name }}
          path: dist-release/*
          if-no-files-found: error
          retention-days: 14

  # The macOS universal bundle in three parts, so the two architectures
  # compile at the same time instead of one after the other (`tauri build
  # --target universal-apple-darwin` builds them in turn): the release
  # binary for each architecture, the UI (wasm, the same on every OS), and
  # then `lipo` and `tauri bundle`, which signs and notarises as `tauri
  # build` would.
  macos-binary:
    name: macOS binary (${{ matrix.target }})
    needs: check
    strategy:
      fail-fast: true
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ matrix.target }}
          save-if: ${{ github.event_name == 'workflow_dispatch' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The UI is a bundle resource, read from disk at run time and not
      # compiled in; tauri-build only needs its folder to exist. The real one
      # comes from the ui job when the bundle is made. This holds while
      # tauri.conf.json's frontendDist (compiled in) is not crates/od-ui/dist
      # (scripts/tests/release_workflow_test.sh checks it).
      - name: UI placeholder
        run: mkdir -p crates/od-ui/dist
      # `tauri build` rather than `cargo build`: it turns on the features a
      # release binary needs (custom-protocol).
      - name: Tauri binary
        working-directory: apps/desktop
        run: npx --yes "@tauri-apps/cli@$TAURI_CLI_VERSION" build --target ${{ matrix.target }} --no-bundle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-binary-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/od-desktop
          if-no-files-found: error
          retention-days: 7

  # The UI (wasm) is the same on every OS: built once here for the Linux,
  # Windows and macOS bundles. Ubuntu builds it fastest (6-9 minutes, against
  # 13-15 on the macOS and Windows runners).
  ui:
    name: UI bundle (release)
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-ui
          save-if: ${{ github.event_name == 'workflow_dispatch' }}
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: trunk
      - name: UI bundle (release)
        working-directory: crates/od-ui
        run: trunk build --release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-dist
          path: crates/od-ui/dist
          if-no-files-found: error
          retention-days: 7

  macos-universal:
    name: bundle (macos-universal)
    needs: [macos-binary, ui]
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-dist
          path: crates/od-ui/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: macos-binary-*
          path: macos-binary
      # Where `tauri build --target universal-apple-darwin` leaves it.
      - name: Universal binary
        run: |
          out=target/universal-apple-darwin/release
          mkdir -p "$out"
          lipo -create -output "$out/od-desktop" \
            macos-binary/macos-binary-aarch64-apple-darwin/od-desktop \
            macos-binary/macos-binary-x86_64-apple-darwin/od-desktop
          chmod +x "$out/od-desktop"
          lipo "$out/od-desktop" -verify_arch arm64 x86_64
          lipo -info "$out/od-desktop"
          test -f crates/od-ui/dist/index.html
      # Signing and notarisation are optional. The secrets reach only this
      # step's environment; empty ones are unset so Tauri builds an unsigned
      # bundle, and nothing is printed.
      - name: Tauri bundle
        working-directory: apps/desktop
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          signing=(APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY)
          notarising=(APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID)
          all_set() { for name in "$@"; do [ -n "${!name}" ] || return 1; done; }
          if ! all_set "${signing[@]}"; then
            echo "::warning::macOS signing secrets are not set; building an unsigned bundle (docs/release.md, Signing)"
            unset "${signing[@]}" "${notarising[@]}"
          elif ! all_set "${notarising[@]}"; then
            echo "::warning::notarisation secrets are not set; the bundle is signed but not notarised"
            unset "${notarising[@]}"
          fi
          npx --yes "@tauri-apps/cli@$TAURI_CLI_VERSION" bundle --target universal-apple-darwin --bundles app,dmg
      - name: Collect files
        run: |
          mkdir -p dist-release
          find target/universal-apple-darwin/release/bundle -maxdepth 2 -type f -name '*.dmg' \
            -exec cp {} dist-release/ \;
          ls -l dist-release
          test -n "$(ls dist-release)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-macos-universal
          path: dist-release/*
          if-no-files-found: error
          retention-days: 14

  # The Linux packages installed and opened on clean Ubuntu 22.04 and 24.04
  # (linux-smoke.yml); a broken .deb or AppImage stops the draft release.
  linux-smoke:
    name: Linux smoke
    needs: bundle
    uses: ./.github/workflows/linux-smoke.yml
    with:
      artifact: bundle-linux-x64
      ref: ${{ github.event.inputs.tag || github.ref_name }}

  # The .msi installed, opened and uninstalled on clean Windows Server 2025
  # and 2022 (windows-smoke.yml). A broken installer stops the draft
  # release; a run whose Windows bundle did not build skips it.
  windows-smoke:
    name: Windows smoke
    needs: bundle
    uses: ./.github/workflows/windows-smoke.yml
    with:
      artifact: bundle-windows-x64
      ref: ${{ github.event.inputs.tag || github.ref_name }}

  # Waits for every gate: the macOS tests, every bundle and both smoke tests.
  release:
    name: draft GitHub Release
    needs: [macos-tests, bundle, macos-universal, linux-smoke, windows-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundle-*
          path: dist-release
          merge-multiple: true
      - name: Checksums and notes
        run: |
          cd dist-release
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          cd ..
          scripts/release-notes.sh "$TAG" > release-notes.md
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            # Re-runs may refresh a draft; a published release is never rewritten.
            if [ "$draft" != true ]; then
              echo "::error::release $TAG is already published; its files are not replaced"
              exit 1
            fi
            gh release upload "$TAG" dist-release/* --clobber
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" dist-release/* --draft --verify-tag \
              --title "Contour $TAG" --notes-file release-notes.md
          fi
