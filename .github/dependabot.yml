# Monthly dependency updates, one grouped pull request per ecosystem (CI
# minutes on a private repo). Commit subjects follow Conventional Commits
# (CONTRIBUTING.md): build(deps) for Cargo and npm, ci(deps) for actions.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: build
      include: scope
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /crates/od-ui/e2e
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: build
      include: scope
    groups:
      npm:
        patterns: ["*"]
