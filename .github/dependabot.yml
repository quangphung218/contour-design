# Weekly dependency updates. Commit subjects follow Conventional Commits
# (CONTRIBUTING.md): build(deps) for Cargo and npm, ci(deps) for actions.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      tauri:
        patterns: ["tauri*", "wry", "tao"]
      leptos:
        patterns: ["leptos*", "reactive_*", "tachys"]
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /crates/od-ui/e2e
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
