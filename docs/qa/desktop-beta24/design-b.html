<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font:15px system-ui;background:#fff}
.b{display:inline-block;margin:8px;padding:10px 14px;border:2px solid #333;background:#f4f4f4;font:15px system-ui}
#log{margin:6px 8px;padding:6px;font:16px monospace;background:#ffd;white-space:pre-wrap;min-height:60px}
</style></head><body>
<h3 style="margin:8px">Design B</h3>
<button class="b" id="del">B delete (confirm)</button>
<div id="log"></div>
<script>
var L=document.getElementById('log');
document.getElementById('del').addEventListener('click',function(){var t=Date.now();var r=confirm('Delete?');L.textContent+='B='+r+' '+(Date.now()-t)+'ms\n'});
L.textContent='loaded '+new Date().toISOString().slice(11,19)+'\n';
</script>
</body></html>
