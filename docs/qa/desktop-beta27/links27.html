<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font:15px system-ui;background:#fff}
p{margin:6px 8px}
.b,label,a{display:inline-block;margin:2px 8px;padding:8px 10px;border:2px solid #333;background:#f4f4f4;font:15px system-ui;color:#000}
input[type=text]{font:15px system-ui;padding:6px;width:220px}
#log{margin:6px 8px;padding:6px;font:15px monospace;color:#000;background:#ffd;white-space:pre-wrap;min-height:80px}
</style></head><body>
<p><a id="lk" href="https://example.com/lk-link" target="_blank">LK blank link</a>
<a id="cm" href="https://example.com/cm-link">CM plain link (cmd-click)</a>
<button class="b" id="c0">C0 click opens</button></p>
<p><label id="l1">L1 agree <input type="checkbox" id="l1c"></label>
<label id="l2" for="l2b">L2 label for</label> <button class="b" id="l2b">L2 button</button>
<label id="l3">L3 both open <input type="checkbox" id="l3c"></label></p>
<p><input type="text" id="pre" value="EN: click here, Tab, Enter"> <a id="en" href="https://example.com/en-link" target="_blank">EN link</a></p>
<p><button class="b" id="fm">FM flood on pointerdown</button>
<input type="text" id="fx" value="FX: Enter floods, alerts">
<input type="text" id="stray" value="stray: any keyup opens"></p>
<div id="log"></div>
<script>
var L=document.getElementById('log');
function lg(s){L.textContent+=s+'\n'}
function on(id,t,f){document.getElementById(id).addEventListener(t,f)}
window.floodLeft=0;
function flood(){lg('flood start');for(var i=0;i<1500;i++){floodLeft++;setTimeout(function(){var t=performance.now();while(performance.now()-t<2);floodLeft--;if(floodLeft===0)lg('flood drained')})}}
on('c0','click',function(){window.open('https://example.com/c0-click')});
on('l1c','click',function(){window.open('https://example.com/l1-open')});
on('l2b','click',function(){window.open('https://example.com/l2-open')});
on('l3','click',function(e){if(e.target.id==='l3')window.open('https://example.com/l3-label')});
on('l3c','click',function(){window.open('https://example.com/l3-open')});
on('fm','pointerdown',flood);
on('fm','click',function(){document.getElementById('stray').focus();lg('focus stray')});
on('fx','keydown',function(e){if(e.key==='Enter'){flood();alert('saved');document.getElementById('stray').focus()}});
on('stray','keyup',function(e){lg('stray keyup '+e.key);window.open('https://example.com/stray')});
lg('loaded '+new Date().toISOString().slice(11,19));
</script>
</body></html>
